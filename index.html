<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Launch your own herbal cigarette brand with Eximburg. Licensed manufacturing since 2016, 6 flavours, round batches from ₹6.30 lakh, delivery in 80–110 days. English & Hindi.">
<meta name="theme-color" content="#1F2A24">
<meta property="og:title" content="Eximburg Brand Portal — Launch your own herbal cigarette brand">
<meta property="og:description" content="Plan your batch, see your profit and book your production slot in minutes.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<title>Eximburg Brand Portal — Launch your own herbal cigarette brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3EE; --surface:#FFFFFF; --ink:#1F2A24; --muted:#5B675F; --line:#DAD9CF;
  --rose:#A8324F; --rose-soft:#F6E4E9; --leaf:#3F6B35; --leaf-soft:#E4EEDF; --gold:#B87F0C; --gold-soft:#FBF1D9;
  --side:#1F2A24; --side-ink:#E9EEE8; --side-muted:#9FB0A5;
  --display:'Poppins','Mukta','Noto Sans Devanagari',system-ui,sans-serif;
  --body:'Mukta','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131A16; --surface:#1B241F; --ink:#E9EEE8; --muted:#A1AEA5; --line:#2E3B34;
    --rose:#E3748E; --rose-soft:#3A2129; --leaf:#8DC27B; --leaf-soft:#22321F; --gold:#E7B84E; --gold-soft:#372C14;
    --side:#0E1310; --side-ink:#E9EEE8; --side-muted:#8A9A90;
  }
}
:root[data-theme="dark"]{
  --bg:#131A16; --surface:#1B241F; --ink:#E9EEE8; --muted:#A1AEA5; --line:#2E3B34;
  --rose:#E3748E; --rose-soft:#3A2129; --leaf:#8DC27B; --leaf-soft:#22321F; --gold:#E7B84E; --gold-soft:#372C14;
  --side:#0E1310; --side-ink:#E9EEE8; --side-muted:#8A9A90;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;min-height:100%;-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0 0 .4em}
h1{font-size:clamp(2rem,4.2vw,3rem)}
h2{font-size:clamp(1.45rem,2.6vw,1.85rem);margin-top:1.6em}
h3{font-size:1.2rem}
p{margin:0 0 1em;max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:.9rem}
a{color:var(--rose)}

/* ---------- Login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--side);color:var(--side-ink);padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.login-art h1{font-size:clamp(2.2rem,4.6vw,3.6rem);max-width:14ch}
.login-art p{color:var(--side-muted);font-size:1.1rem}
.fan{display:flex;align-items:flex-end;height:200px;gap:0;margin:8px 0}
.fan .pack{margin-left:-26px;transform-origin:bottom center}
.fan .pack:first-child{margin-left:0}
@media (prefers-reduced-motion:no-preference){
  .fan .pack{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .fan .pack:nth-child(2){animation-delay:.08s}.fan .pack:nth-child(3){animation-delay:.16s}
  .fan .pack:nth-child(4){animation-delay:.24s}.fan .pack:nth-child(5){animation-delay:.32s}.fan .pack:nth-child(6){animation-delay:.4s}
}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotate(var(--r,0deg))}to{opacity:1;transform:translateY(0) rotate(var(--r,0deg))}}
.login-facts{display:flex;flex-wrap:wrap;gap:28px}
.login-facts div{min-width:110px}
.login-facts b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:400;color:#fff}
.login-facts span{color:var(--side-muted);font-size:.92rem}
.login-form{padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:center;max-width:560px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:.95rem}
.field input,.field select,.field textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1rem;width:100%}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--leaf);outline:none}
.field .err{color:var(--rose);font-size:.85rem;min-height:1em}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;margin:4px 0 18px}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--leaf);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 24px;font-weight:600;font-size:1rem;cursor:pointer;text-decoration:none;transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--rose);color:#fff}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-leaf{background:var(--leaf);color:#fff}
:root[data-theme="dark"] .btn-leaf{color:#10160f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-leaf{color:#10160f}}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lang{display:inline-flex;border:1.5px solid currentColor;border-radius:999px;overflow:hidden;font-size:.9rem;opacity:.95}
.lang button{border:0;background:transparent;padding:5px 12px;cursor:pointer;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--gold);color:#1b1405}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:24px 18px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brandmark{font-family:var(--display);font-size:1.45rem;line-height:1.1}
.brandmark small{display:block;font-family:var(--body);font-size:.82rem;color:var(--side-muted);margin-top:4px}
.journey{font-size:.88rem;color:var(--side-muted)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .5s ease}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:transparent;border:0;color:var(--side-ink);padding:9px 10px;border-radius:10px;cursor:pointer;font-size:.97rem}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.1)}
.nav .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--side-muted);display:grid;place-items:center;font-size:.8rem;flex:none;color:var(--side-muted)}
.nav .done .n{background:var(--leaf);border-color:var(--leaf);color:#10160f}
.nav button[aria-current="page"] .n{border-color:var(--gold);color:var(--gold)}
.nav .final button{color:var(--gold);font-weight:600}
.side-foot{margin-top:auto;font-size:.82rem;color:var(--side-muted);display:flex;flex-direction:column;gap:10px}
.side-foot button.linkish{background:none;border:0;color:var(--side-muted);text-decoration:underline;cursor:pointer;padding:0;text-align:left}
.top{display:none}
.main{min-width:0}
.content{max-width:940px;margin:0 auto;padding:40px clamp(18px,4vw,48px) 80px}
.stepline{color:var(--muted);font-size:.92rem;margin-bottom:8px}
.lead{font-size:1.18rem;color:var(--muted);max-width:62ch}
.topright{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-bottom:22px;color:var(--muted)}
.page-corner{position:fixed;z-index:80;top:calc(12px + env(safe-area-inset-top,0px));right:14px;display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;box-shadow:0 10px 28px -16px rgba(0,0,0,.55)}
.page-corner .btn{padding:8px 16px}
.login-id{background:var(--leaf-soft);border:1px solid var(--leaf);border-radius:12px;padding:12px 14px;margin:0 0 16px}
.login-id b{display:block;font-family:var(--display);font-size:1.35rem;letter-spacing:.03em;margin-top:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin:18px 0}
.panel h3{margin-bottom:.35em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2 .panel,.grid3 .panel{margin:0}
.facts{display:flex;flex-wrap:wrap;gap:12px 36px;margin:20px 0}
.fact b{display:block;font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.1}
.fact span{color:var(--muted);font-size:.92rem}
.note{border-left:4px solid var(--gold);background:var(--gold-soft);padding:14px 18px;border-radius:0 10px 10px 0;margin:18px 0;font-size:.97rem}
.note.rose{border-color:var(--rose);background:var(--rose-soft)}
.note.leaf{border-color:var(--leaf);background:var(--leaf-soft)}
.src{font-size:.82rem;color:var(--muted)}
ul.clean{padding-left:1.2em;margin:.3em 0 1em}
ul.clean li{margin:.25em 0}
.tablewrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.96rem}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;background:var(--leaf-soft)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap}
.persona{display:flex;gap:14px}
.persona .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;flex:none;background:var(--leaf-soft)}
.tag{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--rose-soft);color:var(--rose);font-weight:600;margin-right:6px}

/* ---------- Pack illustration ---------- */
.pack{width:92px;height:140px;border-radius:7px 7px 5px 5px;background:#FBFAF6;position:relative;box-shadow:0 10px 24px -12px rgba(0,0,0,.45);overflow:hidden;flex:none;border:1px solid rgba(0,0,0,.08)}
.pack::before{content:"";position:absolute;left:0;right:0;top:30px;border-top:1px dashed rgba(0,0,0,.18)}
.pack .band{position:absolute;left:0;right:0;bottom:0;height:52%;background:var(--c,#3F6B35)}
.pack .nm{position:absolute;left:8px;right:8px;top:40px;font-family:var(--display);font-size:.8rem;line-height:1.05;color:#1F2A24;text-align:center;word-break:break-word}
.pack .fl{position:absolute;left:6px;right:6px;bottom:10px;font-size:.62rem;color:#fff;text-align:center;font-weight:600;line-height:1.2}
.pack .tf{position:absolute;left:0;right:0;top:9px;text-align:center;font-size:.55rem;letter-spacing:.02em;color:#6b6b60}
.pack.lg{width:150px;height:226px;border-radius:10px 10px 7px 7px}
.pack.lg::before{top:48px}
.pack.lg .nm{top:64px;font-size:1.3rem}
.pack.lg .fl{font-size:.85rem;bottom:16px}
.pack.lg .tf{font-size:.72rem;top:16px}

/* ---------- Launchpad ---------- */
.calc{background:var(--side);color:var(--side-ink);border-radius:22px;padding:26px clamp(18px,3vw,32px);margin:22px 0}
.calc h3{color:#fff}
.calc .muted{color:var(--side-muted)}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.presets button{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.14);color:var(--side-ink);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600}
.presets button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1b1405}
.presets .rec{font-size:.72rem;display:block;font-weight:500;opacity:.8;line-height:1}
.budgetrow{display:grid;grid-template-columns:1fr 190px;gap:18px;align-items:center}
input[type=range]{width:100%;accent-color:var(--gold);height:28px}
.money-in{display:flex;align-items:center;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);border-radius:12px;padding:0 12px}
.money-in span{color:var(--side-muted)}
.money-in input{background:transparent;border:0;color:#fff;padding:11px 6px;width:100%;font-size:1.1rem;font-weight:600;outline:none}
.flavcount{display:flex;gap:6px;flex-wrap:wrap}
.flavcount button{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);background:transparent;color:var(--side-ink);cursor:pointer;font-weight:700}
.flavcount button[aria-pressed="true"]{background:var(--gold);color:#1b1405;border-color:var(--gold)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.frow{display:grid;grid-template-columns:150px 1fr 130px 34px;gap:12px;align-items:center}
.frow .fname{display:flex;gap:8px;align-items:center;font-weight:600;font-size:.95rem}
.frow .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.frow .track{height:26px;background:rgba(255,255,255,.07);border-radius:6px;overflow:hidden;position:relative}
.frow .fill{height:100%;background:var(--c);border-radius:6px;transition:width .35s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:.78rem;font-weight:700;color:#fff;min-width:4px}
.frow input{width:100%;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.18);border-radius:8px;color:#fff;padding:6px 8px;text-align:right;font-weight:600}
.frow input:focus{border-color:var(--gold);outline:none}
.lockbtn{background:none;border:0;cursor:pointer;font-size:1.05rem;color:var(--side-muted);padding:4px}
.lockbtn[aria-pressed="true"]{color:var(--gold)}
.calc-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12)}
.calc-sum b{display:block;font-family:var(--display);font-weight:400;font-size:1.55rem;color:#fff;line-height:1.15}
.calc-sum span{font-size:.86rem;color:var(--side-muted)}
.calc .warn{color:#F3C77A;font-size:.9rem;min-height:1.2em;margin-top:8px}
.previewrow{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.previewrow .packs{display:flex;gap:8px;flex-wrap:wrap}
.previewrow .packs .pack{width:64px;height:98px}
.previewrow .packs .pack .nm{font-size:.58rem;top:30px}
.previewrow .packs .pack::before{top:22px}
.previewrow .packs .pack .fl{font-size:.5rem;bottom:6px}
.previewrow .packs .pack .tf{font-size:.42rem;top:7px}
.mrp{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mrp input[type=range]{max-width:320px;accent-color:var(--leaf)}
.mrp b{font-family:var(--display);font-weight:400;font-size:1.4rem}

/* ---------- Timeline ---------- */
.tl{list-style:none;margin:22px 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 26px 60px}
.tl .dotn{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--surface);border:2px solid var(--leaf);display:grid;place-items:center;font-weight:700;color:var(--leaf)}
.tl li.pay .dotn{border-color:var(--rose);color:var(--rose)}
.tl h3{margin:.15em 0 .2em;font-size:1.15rem}
.tl .meta{display:flex;flex-wrap:wrap;gap:8px;margin:.3em 0}
.chip{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 12px;font-size:.85rem;font-weight:600}
.chip.money{border-color:var(--rose);color:var(--rose)}
.chip.time{border-color:var(--leaf);color:var(--leaf)}

/* ---------- Booking ---------- */
.slots{display:flex;gap:6px;margin:8px 0}
.slots i{width:30px;height:12px;border-radius:4px;background:var(--line)}
.slots i.free{background:var(--gold)}
.success{text-align:left}
.bookid{font-family:var(--display);font-size:1.8rem}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:10px 0;padding:0 18px}
summary{cursor:pointer;padding:14px 0;font-weight:600;list-style-position:outside}
details p{margin-top:0}
.chart{width:100%;height:auto}
.chart text{font-family:var(--body);fill:var(--muted);font-size:12px}
.chart .v{fill:var(--ink);font-weight:600}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .login-art{padding-bottom:36px}
  .fan{height:150px}
  .fan .pack{width:66px;height:100px;margin-left:-18px}
  .fan .pack .nm{font-size:.6rem;top:30px}.fan .pack::before{top:22px}.fan .pack .fl{font-size:.5rem;bottom:6px}.fan .pack .tf{font-size:.42rem;top:7px}
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);height:100%;z-index:40;transform:translateX(-105%);transition:transform .25s ease;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39;display:none}
  .scrim.show{display:block}
  .top{display:flex;position:sticky;top:0;z-index:30;background:var(--side);color:var(--side-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;align-items:center;gap:12px}
  .top .menu{background:none;border:0;color:inherit;font-size:1.5rem;cursor:pointer;padding:2px 6px}
  .top .t{font-family:var(--display);font-size:1.1rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topright{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .calc-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
  .budgetrow{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr 110px 30px;grid-template-areas:"n i l" "t t t"}
  .frow .fname{grid-area:n}.frow .track{grid-area:t;height:18px}.frow input{grid-area:i}.frow .lockbtn{grid-area:l}
  .frow .fill{font-size:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= v2 additions ================= */
body.has-bar .content{padding-bottom:130px}
/* 3D pack */
.scene{width:250px;height:300px;perspective:1000px;display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;position:relative;flex:none}
.scene:active{cursor:grabbing}
.scene::after{content:"";position:absolute;bottom:18px;left:50%;width:150px;height:22px;margin-left:-75px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent);z-index:-1}
.p3{--w:142px;--h:212px;--d:50px;--lh:56px;position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;transform:rotateX(var(--rx,-14deg)) rotateY(var(--ry,-30deg))}
.b3,.l3{position:absolute;left:0;width:var(--w);transform-style:preserve-3d}
.b3{top:var(--lh);height:calc(var(--h) - var(--lh));--hh:calc(var(--h) - var(--lh))}
.l3{top:0;height:var(--lh);--hh:var(--lh);transform-origin:50% 100% calc(var(--d) / -2);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.p3.open .l3{transform:rotateX(118deg)}
.fc{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;background:#FBFAF6;box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
.fc.front{transform:translateZ(calc(var(--d) / 2))}
.fc.back{transform:rotateY(180deg) translateZ(calc(var(--d) / 2))}
.fc.right,.fc.left{width:var(--d);left:calc((var(--w) - var(--d)) / 2)}
.fc.right{transform:rotateY(90deg) translateZ(calc(var(--w) / 2))}
.fc.left{transform:rotateY(-90deg) translateZ(calc(var(--w) / 2))}
.fc.top,.fc.bot{height:var(--d);top:calc((var(--hh) - var(--d)) / 2)}
.fc.top{transform:rotateX(90deg) translateZ(calc(var(--hh) / 2))}
.fc.bot{transform:rotateX(-90deg) translateZ(calc(var(--hh) / 2))}
.b3 .fc.front{display:flex;flex-direction:column}
.b3 .front .nm3{font-family:var(--display);color:#1F2A24;text-align:center;font-size:1.05rem;line-height:1.05;padding:10px 8px 6px;word-break:break-word;flex:1;display:flex;align-items:center;justify-content:center}
.b3 .front .bd3{background:var(--c);color:#fff;text-align:center;padding:10px 6px 12px;font-size:.72rem;font-weight:600;line-height:1.25;height:54%}
.b3 .front .bd3 b{display:block;font-size:.88rem;margin-bottom:3px}
.l3 .front{display:flex;flex-direction:column;justify-content:space-between}
.l3 .front .tf3{font-size:.56rem;text-align:center;color:#6b6b60;padding-top:10px;letter-spacing:.02em}
.l3 .front .st3,.l3 .right .st3,.l3 .left .st3,.l3 .back .st3{height:7px;background:var(--c)}
.l3 .right,.l3 .left,.l3 .back{display:flex;flex-direction:column;justify-content:flex-end}
.l3 .top{background:#FBFAF6;display:grid;place-items:center;font-family:var(--display);font-size:.62rem;color:#1F2A24}
.b3 .right,.b3 .left{background:var(--c);color:#fff;font-size:.52rem;font-weight:600;writing-mode:vertical-rl;text-orientation:mixed;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 0;line-height:1.2}
.b3 .back{font-size:.5rem;color:#4a4a42;padding:10px 8px;line-height:1.35}
.b3 .back b{display:block;font-size:.56rem;color:#1F2A24;margin-bottom:4px}
.b3 .top{background:#E9DDC4;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,1fr);gap:3px;padding:6px 8px}
.b3 .top i{border-radius:50%;background:radial-gradient(circle at 45% 40%,#F4E7CC 0 35%,#D9B27C 36%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.b3 .bot{background:#e8e6de}
.viewer{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.viewer .ctl{flex:1;min-width:240px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.chips button .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chips button[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.calc .chips button{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:var(--side-ink)}
.calc .chips button[aria-pressed="true"]{border-color:var(--gold)}
.hint{font-size:.82rem;color:var(--muted)}
.calc .hint{color:var(--side-muted)}

/* Tier cards */
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0 18px}
.tier{position:relative;text-align:left;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 14px 12px;color:var(--side-ink);cursor:pointer}
.tier:hover{border-color:rgba(255,255,255,.35)}
.tier[aria-pressed="true"]{border-color:var(--gold);background:rgba(231,184,78,.12)}
.tier .bud{font-weight:700;font-size:1.02rem}
.tier .pp{font-family:var(--display);font-size:1.9rem;line-height:1.1;color:#fff}
.tier .pp small{font-family:var(--body);font-size:.8rem;color:var(--side-muted)}
.tier .ln{font-size:.8rem;color:var(--side-muted);line-height:1.35}
.tier .save{display:inline-block;margin-top:6px;font-size:.76rem;font-weight:700;color:#1b1405;background:var(--gold);border-radius:99px;padding:1px 9px}
.tier .badge{position:absolute;top:-10px;right:10px;white-space:nowrap;font-size:.7rem;font-weight:700;background:var(--rose);color:#fff;border-radius:99px;padding:1px 9px}
.nudge{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:rgba(231,184,78,.12);border:1.5px dashed var(--gold);border-radius:12px;padding:12px 16px;margin-top:16px;font-size:.95rem}
.nudge b{color:#fff}
.nudge button{background:var(--gold);color:#1b1405;border:0;border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer}
.budget-custom{font-size:.9rem;color:var(--side-muted);margin:4px 0 6px}

/* Sticky plan bar */
.planbar{position:fixed;left:290px;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:10px clamp(14px,3vw,32px) calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;justify-content:space-between;box-shadow:0 -8px 24px -18px rgba(0,0,0,.4)}
.planbar .pi{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;font-size:.9rem;color:var(--muted);min-width:0}
.planbar .pi b{color:var(--ink);font-size:1rem}
.planbar .btn{padding:11px 20px;white-space:nowrap}

/* Profit */
.sliders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.sliders label{display:block;font-weight:600;font-size:.92rem}
.sliders output{font-family:var(--display);font-size:1.35rem;display:block}
.sliders input[type=range]{accent-color:var(--leaf);width:100%}
.big-result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
.big-result div{border-radius:14px;padding:16px 18px;background:var(--leaf-soft)}
.big-result div.hl{background:var(--gold-soft)}
.big-result b{display:block;font-family:var(--display);font-weight:400;font-size:1.9rem;line-height:1.1}
.big-result span{font-size:.88rem;color:var(--muted)}
.meter{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px;display:flex}
.meter i{display:block;height:100%}
tr.cur td{background:var(--gold-soft);font-weight:600}
.checks{list-style:none;padding:0;margin:.4em 0 1em;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}
.checks li{padding-left:28px;position:relative}
.checks li::before{content:"✓";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--leaf);color:#fff;font-size:.75rem;display:grid;place-items:center;font-weight:700;margin-top:3px}
.next48{counter-reset:n;list-style:none;padding:0;margin:0}
.next48 li{counter-increment:n;padding:6px 0 6px 38px;position:relative}
.next48 li::before{content:counter(n);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;border:2px solid var(--leaf);color:var(--leaf);font-weight:700;display:grid;place-items:center;font-size:.85rem}
.twoways{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.twoways .panel{margin:0}
.countdown{font-family:var(--display);font-size:2.2rem;line-height:1}

@media (max-width:900px){
  .planbar{left:0}
  .planbar .pi .hide-m{display:none}
  .tiers{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sliders,.big-result{grid-template-columns:1fr}
  .checks{grid-template-columns:1fr}
  .twoways{grid-template-columns:1fr}
  .scene{width:100%;max-width:280px;margin:0 auto}
}

/* login 3D shelf */
.fan3{display:flex;align-items:flex-end;justify-content:flex-start;gap:0;margin:10px 0 4px;flex-wrap:nowrap}
.scene.mini{width:92px;height:170px;perspective:700px;margin-left:-8px}
.scene.mini:first-child{margin-left:0}
.scene.mini::after{width:80px;margin-left:-40px;bottom:10px;height:14px}
.scene.mini .p3{--w:70px;--h:106px;--d:26px;--lh:30px}
.scene.mini .b3 .front .nm3{font-size:.62rem;padding:6px 4px 4px}
.scene.mini .b3 .front .bd3{font-size:.4rem;padding:5px 3px 6px}
.scene.mini .b3 .front .bd3 b{font-size:.5rem;margin-bottom:1px}
.scene.mini .l3 .front .tf3{font-size:.36rem;padding-top:6px}
.scene.mini .l3 .front .st3,.scene.mini .l3 .right .st3,.scene.mini .l3 .left .st3,.scene.mini .l3 .back .st3{height:4px}
.scene.mini .b3 .right,.scene.mini .b3 .left{font-size:.34rem}
.scene.mini .b3 .back{font-size:.3rem;padding:5px 4px}
.scene.mini .b3 .back b{font-size:.36rem}
.scene.mini .l3 .top{font-size:.36rem}
.scene.mini .b3 .top{gap:2px;padding:3px 4px}
@media (prefers-reduced-motion:no-preference){
  .fan3 .scene.mini{animation:rise3 .7s cubic-bezier(.2,.8,.2,1) both}
  .fan3 .scene.mini:nth-child(2){animation-delay:.08s}.fan3 .scene.mini:nth-child(3){animation-delay:.16s}
  .fan3 .scene.mini:nth-child(4){animation-delay:.24s}.fan3 .scene.mini:nth-child(5){animation-delay:.32s}.fan3 .scene.mini:nth-child(6){animation-delay:.4s}
}
@keyframes rise3{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@media (max-width:900px){
  .fan3{flex-wrap:wrap;justify-content:center;max-width:320px}
  .scene.mini{width:96px;height:150px;margin-left:0;max-width:none}
}

/* login conversion triggers */
.triggers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trig{border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.04)}
.trig .tg{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;font-weight:700;color:#1b1405;background:var(--gold);border-radius:99px;padding:1px 10px 1px 8px;margin-bottom:6px}
.trig b{display:block;font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.15;color:#fff}
.trig .ds{display:block;color:var(--side-muted);font-size:.84rem;line-height:1.35;margin-top:2px}
@media (max-width:1100px){.triggers{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ================= v3: professional type + dashboard + lot calculator ================= */
h1,h2,h3,.brandmark,.fact b,.calc-sum b,.tier .pp,.big-result b,.trig b,.login-facts b,.bookid,.countdown,.sliders output,.mrp b,.kpi b,.eq b,.rung .pp,.stepper b{font-family:var(--display);font-weight:600;letter-spacing:-.015em}
h1{font-size:clamp(1.75rem,3.4vw,2.5rem);line-height:1.2}
h2{font-size:clamp(1.3rem,2.3vw,1.6rem)}
h3{font-size:1.08rem}
.login-art h1{font-size:clamp(2rem,4vw,3rem);font-weight:700;letter-spacing:-.025em}
.brandmark{font-weight:700;letter-spacing:-.02em}
.fact b{font-size:1.7rem}.calc-sum b{font-size:1.35rem}.big-result b{font-size:1.6rem}.trig b{font-size:1.2rem}
.b3 .front .nm3{font-weight:700;letter-spacing:-.01em;font-size:.95rem}
.scene.mini .b3 .front .nm3{font-size:.55rem}
.stepline{font-weight:600;font-size:.82rem;letter-spacing:.02em;color:var(--leaf)}

/* dashboard */
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi b{font-size:1.5rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi em{font-style:normal;font-size:.8rem;color:var(--muted)}
.kpi.hl{background:var(--leaf-soft);border-color:transparent}
.kpi.hl b{color:var(--leaf)}
.dash-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.dash-grid .panel{margin:0}
.dash-grid .viewer{flex-direction:column;align-items:stretch;gap:6px}
.dash-grid .viewer .scene{margin:0 auto}
.qplans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.qplans button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.qplans button b{font-family:var(--display);font-size:1.15rem;font-weight:600}
.qplans button span{font-size:.82rem;color:var(--muted)}
.qplans button[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.mixbar{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px;margin:8px 0}
.mixbar i{display:block;height:100%}
.mixbar.dark{height:20px;background:rgba(255,255,255,.06)}
.mixlegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.mixlegend span{display:inline-flex;align-items:center;gap:6px}
.mixlegend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.mixlegend b{color:var(--ink)}
.tlbar{display:flex;gap:3px;margin-top:10px;border-radius:10px;overflow:hidden}
.tlbar div{min-width:64px;color:#fff;padding:8px 10px;display:flex;flex-direction:column;line-height:1.2}
.tlbar span{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlbar small{font-size:.75rem;opacity:.9}
.checklist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 14px;margin-top:8px}
.checklist button{display:flex;gap:10px;align-items:center;border:0;background:none;padding:6px 0;cursor:pointer;text-align:left;font-size:.95rem;color:var(--muted)}
.checklist button span{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.75rem;flex:none}
.checklist button.ok{color:var(--ink)}
.checklist button.ok span{background:var(--leaf);border-color:var(--leaf);color:#fff}

/* launchpad v3 */
.stepnum{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:1.05rem;color:#fff;margin-bottom:10px}
.stepnum span{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1b1405;display:grid;place-items:center;font-size:.9rem}
.match{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 18px}
.eq{display:flex;flex-direction:column;align-items:flex-start}
.eq .lbl{font-size:.78rem;color:var(--side-muted);font-weight:600}
.eq b{font-size:1.35rem;color:#fff}
.eq.total b{color:var(--gold);font-size:1.6rem}
.arrow{font-size:1.4rem;color:var(--side-muted);font-weight:300}
.expl{flex-basis:100%;margin:6px 0 0;font-size:.9rem;color:var(--side-muted)}
.expl b{color:#fff}
.stepper{display:inline-flex;align-items:center;gap:0;border:1.5px solid rgba(255,255,255,.22);border-radius:10px;overflow:hidden}
.stepper button{width:38px;height:38px;border:0;background:rgba(255,255,255,.08);color:#fff;font-size:1.25rem;cursor:pointer;font-weight:600}
.stepper button:hover{background:rgba(255,255,255,.16)}
.stepper b{min-width:86px;text-align:center;color:#fff;font-size:1.3rem;padding:0 8px}
.stepper.sm button{width:34px;height:34px;font-size:1.1rem}
.stepper.sm b{min-width:70px;font-size:1.02rem}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rung{position:relative;text-align:left;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);border-radius:12px;padding:12px;color:var(--side-ink);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.rung:hover{border-color:rgba(255,255,255,.35)}
.rung .pp{font-size:1.6rem;color:#fff;line-height:1.1}
.rung .rg{font-size:.82rem;font-weight:600}
.rung .rv{font-size:.78rem;color:var(--side-muted)}
.rung.on{border-color:var(--gold);background:rgba(231,184,78,.14)}
.rung.past{opacity:.6}
.rung .you{position:absolute;top:-9px;right:10px;background:var(--gold);color:#1b1405;font-size:.7rem;font-weight:700;border-radius:99px;padding:1px 9px}
.lrow{display:grid;grid-template-columns:170px 1fr auto;gap:12px;align-items:center;padding:6px 0}
.lrow .fname{background:none;border:0;color:var(--side-ink);display:flex;gap:8px;align-items:center;font-weight:600;font-size:.95rem;cursor:pointer;padding:0;text-align:left}
.lrow .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.lots{display:flex;flex-wrap:wrap;gap:4px}
.lots i{width:26px;height:18px;border-radius:4px;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.minibtn{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);color:var(--side-ink);border-radius:99px;padding:5px 14px;cursor:pointer;font-weight:600;font-size:.88rem}
.calc .warn .minibtn{margin-left:8px;color:#1b1405;background:var(--gold);border-color:var(--gold)}


@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-grid{grid-template-columns:1fr}
  .checklist{grid-template-columns:1fr 1fr}
  .ladder{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lrow{grid-template-columns:1fr auto;grid-template-areas:"n s" "l l"}
  .lrow .fname{grid-area:n}.lrow .stepper{grid-area:s}.lrow .lots{grid-area:l}
  .arrow{display:none}
  .match{gap:12px 22px}
  .tlbar div{min-width:0}
  .tlbar span{font-size:.7rem}
}

/* ================= final: slots, gantt, parallel tracks ================= */
.slotboard{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:6px;margin:12px 0 8px}
.slotboard i,.slotkey i{display:grid;place-items:center;aspect-ratio:1;border-radius:8px;font-style:normal;font-size:.7rem;font-weight:700}
.slotboard i.rs,.slotkey i.rs{background:var(--gold-soft);color:var(--gold);border:1.5px solid var(--gold)}
.slotboard i.bk,.slotkey i.bk{background:var(--line);color:var(--muted)}
.slotboard i.op,.slotkey i.op{background:var(--leaf);box-shadow:0 0 0 0 rgba(63,107,53,.5)}
.slotboard i.me{background:var(--rose);color:#fff;font-size:.62rem}
@media (prefers-reduced-motion:no-preference){.slotboard i.op{animation:pulse 1.8s ease-out infinite}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,107,53,.55)}70%{box-shadow:0 0 0 8px rgba(63,107,53,0)}100%{box-shadow:0 0 0 0 rgba(63,107,53,0)}}
.slotkey{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;color:var(--muted)}
.slotkey span{display:inline-flex;align-items:center;gap:6px}
.slotkey i{width:14px;height:14px;border-radius:4px;aspect-ratio:auto}
.sp-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.leftbig{font-family:var(--display);font-weight:700;font-size:2.2rem;color:var(--rose);line-height:1}
.leftbig small{font-family:var(--body);font-size:.9rem;font-weight:600;color:var(--muted)}
.slotpanel{border:2px solid var(--rose)}
.fomo{display:flex;align-items:center;gap:10px;background:var(--rose-soft);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.95rem}
.fomo .pulse{width:10px;height:10px;border-radius:50%;background:var(--rose);flex:none}
@media (prefers-reduced-motion:no-preference){.fomo .pulse{animation:blink 1.2s ease-in-out infinite}}
@keyframes blink{50%{opacity:.25}}
.slotbadge{background:var(--rose);color:#fff !important;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
.gantt{display:flex;flex-direction:column;gap:6px}
.grow{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center}
.gl{font-size:.85rem;font-weight:600}
.gt{position:relative;height:26px;background:var(--bg);border-radius:6px}
.gb{position:absolute;top:0;height:100%;border-radius:6px;display:flex;align-items:center;padding:0 6px;min-width:26px}
.gb span{color:#fff;font-size:.72rem;font-weight:700;white-space:nowrap}
.gb.hatch{background:repeating-linear-gradient(45deg,var(--rose) 0 4px,transparent 4px 8px);opacity:.45}
.gpar{position:relative;border:1.5px dashed var(--line);border-radius:10px;padding:18px 8px 8px;display:flex;flex-direction:column;gap:6px;margin:4px -8px}
.gpar>span{position:absolute;top:-10px;left:12px;background:var(--surface);padding:0 8px;font-size:.75rem;font-weight:700;color:var(--rose)}
.gaxis{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);padding-left:180px}
.par2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.par2 .panel{margin:0;padding:14px 16px}
.rsproof{background:var(--side);color:var(--side-ink);border-radius:18px;padding:22px 24px;margin:18px 0}

<script>

/* ======================================================================

const FLAVOURS = [

  {en:"Regular", hi:"रेगुलर",  c:"#1B1B1B", t:"#FFFFFF", note:"Black", nh:"काला"},
  {en:"Mint",    hi:"मिंट",    c:"#5BB8DD", t:"#0C2A36", note:"Iced Blue", nh:"आइस्ड ब्लू"},
  {en:"Frutta",  hi:"फ्रूटा",  c:"#E8741E", t:"#FFFFFF", note:"Orange", nh:"नारंगी"},
  {en:"Pan",     hi:"पान",     c:"#2E7D32", t:"#FFFFFF", note:"Green", nh:"हरा"},
  {en:"Ginger",  hi:"जिंजर",   c:"#D9B85C", t:"#2A2008", note:"Light Gold", nh:"हल्का सुनहरा"}
];
const FLAVOUR_PITCH = [
  ["Bold and warm. For regular smokers who want a strong, familiar draw.","बोल्ड और गर्माहट भरा। उन रेगुलर स्मोकर्स के लिए जो मज़बूत, जाना-पहचाना स्वाद चाहते हैं।"],
  ["Classic, no-fuss taste — the closest to what smokers already know. Your everyday seller.","क्लासिक, सीधा स्वाद — स्मोकर्स जो जानते हैं उसके सबसे करीब। आपका रोज़ का बिकने वाला।"],
  ["Cool and fresh. A natural first pick for new buyers and women smokers.","ठंडा और ताज़ा। नए खरीदारों और महिला स्मोकर्स की स्वाभाविक पहली पसंद।"],
  ["Fruity and sweet. Made for parties, cafés and sharing.","फ्रूटी और मीठा। पार्टी, कैफ़े और शेयरिंग के लिए बना।"],
  ["The taste of Indian paan. Uniquely Indian — a strong story for export too.","भारतीय पान का स्वाद। पूरी तरह भारतीय — एक्सपोर्ट के लिए भी मज़बूत कहानी।"],
  ["Warm and spicy. Stands out on any shelf and in any reel.","गर्म और मसालेदार। हर शेल्फ और हर रील में अलग दिखता है।"]
];
const SECTIONS = [
  {id:"home", en:"Your dashboard", hi:"आपका डैशबोर्ड"},
  {id:"what", en:"Herbal Cigarettes", hi:"हर्बल सिगरेट"},
  {id:"market", en:"Market size", hi:"मार्केट साइज़"},
  {id:"future", en:"Future scope", hi:"भविष्य की संभावनाएं"},
  {id:"target", en:"Target customers", hi:"टारगेट ग्राहक"},
  {id:"about", en:"About Eximburg", hi:"Eximburg के बारे में"},
  {id:"benefits", en:"Why this business", hi:"यह बिज़नेस क्यों"},
  {id:"launchpad", en:"Brand launchpad", hi:"ब्रांड लॉन्चपैड"},
  {id:"profit", en:"Your profit plan", hi:"आपका प्रॉफिट प्लान"},
  {id:"influencer", en:"Influencer sales plan", hi:"इन्फ्लुएंसर सेल्स प्लान"},
  {id:"process", en:"Manufacturing process", hi:"मैन्युफैक्चरिंग प्रोसेस"},
  {id:"mindset", en:"Business mindset", hi:"बिज़नेस माइंडसेट"},
  {id:"book", en:"Book your slot", hi:"अपना स्लॉट बुक करें"}
];

/* ---------------- state ---------------- */
const KEY = "exb_brand_portal_final";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = Object.assign({ lang:"en", user:null, visited:[], current:"home", calc:null, booking:null, callReq:null, view:0, mind:[null,null,null,null,null], lidOpen:false, returning:false }, load());
if(!S.calc || S.calc.total == null) S.calc = null;
const tx = (en, hi) => S.lang === "hi" ? hi : en;
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const num = n => Math.round(n).toLocaleString("en-IN");
const lakh = n => "₹" + (n/100000).toLocaleString("en-IN",{maximumFractionDigits:2}) + (S.lang==="hi"?" लाख":" L");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brand = () => (S.user && S.user.brand) ? S.user.brand : tx("Your Brand","आपका ब्रांड");
const ROLES = [
  {id:"admin", en:"Admin", hi:"एडमिन"},
  {id:"sales", en:"Sales", hi:"सेल्स"},
  {id:"production", en:"Production", hi:"प्रोडक्शन"},
  {id:"user", en:"User", hi:"यूज़र"}
];
const roleLabel = id => { const r = ROLES.find(x => x.id === id); return r ? tx(r.en, r.hi) : ""; };
function loginIdForEmail(email){
  const e = String(email || "").trim().toLowerCase();
  const local = (e.split("@")[0] || "user").replace(/[^a-z0-9]/g, "").slice(0, 10) || "user";
  let h = 2166136261;
  for(let i = 0; i < e.length; i++){ h ^= e.charCodeAt(i); h = Math.imul(h, 16777619); }
  const code = (h >>> 0).toString(36).toUpperCase().padStart(6, "0").slice(0, 6);
  return "EXB-" + local + "-" + code;
}
const fname = f => S.lang==="hi" ? FLAVOURS[f].hi : FLAVOURS[f].en;
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDate(d){ return d.toLocaleDateString(S.lang==="hi"?"hi-IN":"en-IN",{day:"numeric",month:"short",year:"numeric"}); }

/* ---------------- pricing & calculator engine (v3: printing lots of 1,000) ---------------- */
/* Flow: budget → smart match to a round batch (multiple of 1,000 packs) → price tier by batch size
   → split into flavours in lots of 1,000 → order value = packs × price. */
const LOT = () => CONFIG.lot;
function priceForPacks(T){ let p = CONFIG.basePrice; CONFIG.tiers.forEach(t=>{ if(T >= t.packs) p = t.price; }); return p; }
const price = () => priceForPacks(S.calc.total);
const orderFor = T => T * priceForPacks(T);
function minTotal(n = S.calc.n){ return Math.max(n * LOT(), CONFIG.minPacks); }
function smartMatch(B, n = S.calc.n){
  let best = minTotal(n), bestDiff = Infinity;
  for(let T = minTotal(n); T <= CONFIG.maxPacks; T += LOT()){
    const d = Math.abs(orderFor(T) - B);
    if(d < bestDiff){ best = T; bestDiff = d; }
  }
  return best;
}
function allocate(total, n){
  const lots = total / LOT(), base = Math.floor(lots / n), extra = lots - base*n;
  const hero = (typeof S!=="undefined" && S && S.view!=null) ? S.view : 0;
  const order = [hero, ...FLAVOURS.map((_,k)=>k).filter(k=>k!==hero)];
  return Array.from({length:n},(_,i)=>({ i: order[i], packs:(base + (i < extra ? 1 : 0)) * LOT() }));
}
function freshCalc(budget, n){ const total = smartMatch(budget, n); return { budget, n, total, flav: allocate(total, n), mrp:199, cost:35, reorders:2 }; }
function keepPrefs(c){ return {mrp:S.calc.mrp, cost:S.calc.cost, reorders:S.calc.reorders}; }
function setBudget(B){ const n=S.calc.n; S.calc = Object.assign(freshCalc(B, n), keepPrefs()); save(); }
function setFlavourCount(n){ const T = Math.max(minTotal(n), S.calc.total); S.calc = Object.assign({budget:S.calc.budget, n, total:T, flav:allocate(T,n)}, keepPrefs()); save(); }
function setTotal(T){
  const c = S.calc; T = Math.max(minTotal(), Math.min(CONFIG.maxPacks, T));
  let diff = (T - c.total) / LOT();
  while(diff > 0){ const f = c.flav.reduce((a,b)=> b.packs < a.packs ? b : a); f.packs += LOT(); diff--; }
  while(diff < 0){ const f = c.flav.reduce((a,b)=> b.packs > a.packs ? b : a); if(f.packs <= LOT()) break; f.packs -= LOT(); diff++; }
  c.total = c.flav.reduce((a,f)=>a+f.packs,0); c.budget = orderFor(c.total); save();
}
function balance(){ S.calc.flav = allocate(S.calc.total, S.calc.n).map((f,k)=>({i:S.calc.flav[k].i, packs:f.packs})); save(); }
/* move one lot of 1,000 into / out of a flavour while the batch total stays the same */
function moveLot(idx, dir){
  const c = S.calc, me = c.flav[idx], others = c.flav.filter((f,k)=>k!==idx);
  if(dir > 0){
    const donor = others.filter(f=>f.packs > LOT()).sort((a,b)=>b.packs-a.packs)[0];
    if(!donor) return "need";
    donor.packs -= LOT(); me.packs += LOT();
  } else {
    if(me.packs <= LOT()) return "min";
    const rec = others.slice().sort((a,b)=>a.packs-b.packs)[0];
    me.packs -= LOT(); rec.packs += LOT();
  }
  save(); return "";
}
function nextTier(){ return CONFIG.tiers.find(t => t.packs > S.calc.total && t.price < price()); }
function tierIndex(T = S.calc.total){ let k = 0; CONFIG.tiers.forEach((t,j)=>{ if(T >= t.packs) k = j; }); return k; }
function mfgDays(packs){ return Math.max(CONFIG.minMfgDays, Math.ceil(packs / CONFIG.packsPerDay)); }
function summary(T){
  const c = S.calc;
  const packs = T ?? c.flav.reduce((a,f)=>a+f.packs,0);
  const p = priceForPacks(packs);
  const order = packs * p, approval = c.n * CONFIG.approvalFeePerFlavour;
  const netMrp = c.mrp / 1.05;                 // MRP incl. 5% GST
  const netAfterCost = netMrp * (1 - c.cost/100);
  const profit = packs * netAfterCost - order - approval;
  const reorderProfit = packs * netAfterCost - order;
  const breakEvenPacks = Math.ceil((order + approval) / netAfterCost);
  const md = mfgDays(packs);
  return { p, packs, order, approval, invest: order+approval, token:order*0.10, pre:order*0.40, dispatch:order*0.50,
    retail: packs*c.mrp, gmPack: netMrp - p, sticks: packs*10, saving: packs*(CONFIG.basePrice - p),
    revenue: packs*netMrp, profit, roi: profit/(order+approval)*100, reorderProfit, breakEvenPacks, netAfterCost,
    yearProfit: profit + reorderProfit*c.reorders, md,
    daysMin: CONFIG.labelDays + Math.max(CONFIG.approvalMin, CONFIG.packagingDays + md) + CONFIG.dispatchDays,
    daysMax: CONFIG.labelDays + Math.max(CONFIG.approvalMax, CONFIG.packagingDays + md) + CONFIG.dispatchDays };
}
function tierRange(k){ const t=CONFIG.tiers[k], nx=CONFIG.tiers[k+1];
  return nx ? `${num(Math.max(t.packs, CONFIG.minPacks))}–${num(nx.packs - LOT())}` : `${num(t.packs)}+`; }
if(!S.calc) S.calc = freshCalc(CONFIG.minBudget, 6);


/* ---------------- monthly slot board (FOMO, config-driven) ---------------- */
function slotInfo(){
  const client = CONFIG.monthSlots - CONFIG.royalSwagReserved;
  const booked = Math.min(client, CONFIG.clientSlotsBooked + (S.booking ? 1 : 0));
  const now = new Date(), month = now.toLocaleDateString(S.lang==="hi"?"hi-IN":"en-IN",{month:"long"});

  const monthEnd = new Date(now.getFullYear(), now.getMonth()+1, 0, 23, 59, 59);
  return { client, booked, left: Math.max(0, client - booked), month, next, daysLeftInMonth: Math.max(0, Math.ceil((monthEnd - now)/86400000)) };
}
function slotBoard(){
  const si = slotInfo(), mine = !!S.booking;
  const cells = [];
  for(let k=0;k<CONFIG.royalSwagReserved;k++) cells.push(`<i class="rs" title="Royal Swag">RS</i>`);
  for(let k=0;k<si.client;k++){
    if(k < CONFIG.clientSlotsBooked) cells.push(`<i class="bk" title="${tx("Booked","बुक")}">✓</i>`);
    else if(mine && k === CONFIG.clientSlotsBooked) cells.push(`<i class="me">${tx("You","आप")}</i>`);
    else cells.push(`<i class="op"></i>`);
  }
  return `<div class="slotboard" aria-label="${tx(`${si.left} of ${si.client} client slots open`,`${si.client} में से ${si.left} क्लाइंट स्लॉट खुले`)}">${cells.join("")}</div>
  <div class="slotkey"><span><i class="rs"></i>${tx(`Royal Swag reserved (${CONFIG.royalSwagReserved})`,`Royal Swag के लिए (${CONFIG.royalSwagReserved})`)}</span><span><i class="bk"></i>${tx(`Booked (${si.booked})`,`बुक (${si.booked})`)}</span><span><i class="op"></i>${tx(`Open (${si.left})`,`खुले (${si.left})`)}</span></div>`;
}
function fmtCountdown(ms){ if(ms<=0) return "0d 00:00:00"; const d=Math.floor(ms/86400000), h=Math.floor(ms%86400000/3600000), m=Math.floor(ms%3600000/60000), s=Math.floor(ms%60000/1000); return `${d}${tx("d","दि")} ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; }
let tickTimer = null;

  if(tickTimer) clearInterval(tickTimer);
  const till = new Date(CONFIG.priceValidTill+"T23:59:59");
  const upd = ()=>{ const el=document.getElementById("tick"); if(!el){ clearInterval(tickTimer); tickTimer=null; return; } el.textContent = fmtCountdown(till - new Date()); };
  upd(); tickTimer = setInterval(upd, 1000);
}

/* ---------------- parallel timeline (Gantt) ---------------- */
function gantt(s, compact){
  const L=CONFIG.labelDays, P=CONFIG.packagingDays, A1=CONFIG.approvalMin, A2=CONFIG.approvalMax, D=CONFIG.dispatchDays;
  const endMin = L + Math.max(A1, P + s.md), total = s.daysMax;
  const pc = d => (d/total*100).toFixed(2)+"%";
  const row = (label, start, len, color, extra="", note="") => `<div class="grow"><div class="gl">${label}</div><div class="gt"><div class="gb" style="left:${pc(start)};width:${pc(len)};background:${color}"><span>${note}</span></div>${extra}</div></div>`;
  const hatch = `<div class="gb hatch" style="left:${pc(L+A1)};width:${pc(A2-A1)}"></div>`;
  return `<div class="gantt ${compact?"compact":""}">
    ${row(tx("Label design","लेबल डिज़ाइन"), 0, L, "var(--gold)", "", `${L}${tx("d","दि")}`)}
    <div class="gpar"><span>${tx("Side by side","साथ-साथ")}</span>
    ${row(tx("Govt. product approval","सरकारी प्रोडक्ट अप्रूवल"), L, A1, "var(--rose)", hatch, `${A1}–${A2}${tx("d","दि")}`)}
    ${row(tx("Packaging","पैकेजिंग"), L, P, "#8A6FB0", "", `${P}${tx("d","दि")}`)}
    ${row(tx("Manufacturing","मैन्युफैक्चरिंग"), L+P, s.md, "var(--leaf)", "", `${s.md}${tx("d","दि")}`)}
    </div>
    ${row(tx("Delivery","डिलीवरी"), endMin, D, "#4A7FA8", "", `${D}${tx("d","दि")}`)}
    <div class="gaxis"><span>${tx("Day 0","दिन 0")}</span><span>${tx(`Day ${s.daysMin}–${s.daysMax}`,`दिन ${s.daysMin}–${s.daysMax}`)}</span></div>
  </div>`;
}

/* ---------------- 3D pack ---------------- */
function pack3D(fl, cls=""){
  const f = FLAVOURS[fl];
  return `<div class="scene ${cls}" data-scene aria-label="${tx(`3D view of ${esc(brand())} ${esc(fname(fl))} pack. Drag to rotate.`,`${esc(brand())} ${esc(fname(fl))} पैक का 3D व्यू। घुमाने के लिए ड्रैग करें।`)}" role="img">

      <div class="fc back"><b>${esc(brand())}</b>${tx("Herbal smoking blend in cigarette form. For adults 18+ only. Keep away from children.","सिगरेट रूप में हर्बल स्मोकिंग ब्लेंड। केवल 18+ वयस्कों के लिए। बच्चों से दूर रखें।")}<br><br>${tx("Mfd. by Eximburg International Pvt. Ltd., Gujarat. Lic. GA/1957","निर्माता: Eximburg International Pvt. Ltd., गुजरात। लाइसेंस GA/1957")}</div>
      <div class="fc right">${tx("10 HERBAL STICKS","10 हर्बल स्टिक")}</div>
      <div class="fc left">${esc(brand())}</div>
      <div class="fc top">${"<i></i>".repeat(10)}</div>
      <div class="fc bot"></div>
    </div>

/* rotation: drag + gentle idle sway */
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let drag = null, userTurned = false, rot = {rx:-14, ry:-30};
function applyRot(){ document.querySelectorAll(".p3").forEach(p=>{ p.style.setProperty("--rx",rot.rx+"deg"); p.style.setProperty("--ry",rot.ry+"deg"); }); }
document.addEventListener("pointerdown", e=>{ const sc=e.target.closest("[data-scene]"); if(!sc) return; drag={x:e.clientX,y:e.clientY,rx:rot.rx,ry:rot.ry}; userTurned=true; try{sc.setPointerCapture(e.pointerId);}catch(err){} });
document.addEventListener("pointermove", e=>{ if(!drag) return; rot.ry = drag.ry + (e.clientX-drag.x)*0.6; rot.rx = Math.max(-50,Math.min(35, drag.rx - (e.clientY-drag.y)*0.4)); applyRot(); });
document.addEventListener("pointerup", ()=>{ drag=null; });
document.addEventListener("pointercancel", ()=>{ drag=null; });
(function sway(t){ if(!reduceMotion && !userTurned && !drag && document.querySelector(".p3")){ rot.ry = -30 + Math.sin(t/1600)*24; applyRot(); } requestAnimationFrame(sway); })(0);

  document.getElementById("nudge").innerHTML = nt ? (()=>{ const add=nt.packs-c.total, extraCost=orderFor(nt.packs)-s.order, sv=nt.packs*(s.p-nt.price);
    return `<div class="nudge"><span>${tx(`Add <b>${num(add)} packs</b> (${inr(extraCost)} more) and every pack drops to <b>₹${nt.price}</b> — you save <b>${inr(sv)}</b> on the ${num(nt.packs)}-pack batch.`,`<b>${num(add)} पैक</b> जोड़ें (${inr(extraCost)} ज़्यादा) और हर पैक <b>₹${nt.price}</b> का हो जाता है — ${num(nt.packs)} पैक के बैच पर <b>${inr(sv)}</b> बचत।`)}</span><button data-tt="${nt.packs}">${tx(`Go to ${num(nt.packs)} packs`,`${num(nt.packs)} पैक चुनें`)}</button></div>`; })()
    : `<div class="nudge"><span>${tx(`<b>Lowest price unlocked: ₹${s.p}/pack.</b> You save ${inr(s.saving)} versus ₹${CONFIG.basePrice}.`,`<b>सबसे कम कीमत: ₹${s.p}/पैक।</b> ₹${CONFIG.basePrice} के मुकाबले ${inr(s.saving)} बचत।`)}</span></div>`;
  document.querySelector(".flavcount").innerHTML = Array.from({length:CONFIG.maxFlavours},(_,i)=>`<button data-nf="${i+1}" aria-pressed="${c.n===i+1}">${i+1}</button>`).join("");
  document.getElementById("mixbar").innerHTML = c.flav.map(f=>`<i style="width:${f.packs/s.packs*100}%;background:${FLAVOURS[f.i].c}"></i>`).join("");
  document.getElementById("stack").innerHTML = c.flav.map((f,j)=>{const F=FLAVOURS[f.i];return `
    <div class="lrow" style="--c:${F.c}">
      <button class="fname" data-pv="${f.i}"><span class="dot"></span>${esc(fname(f.i))}</button>
      <div class="lots" aria-hidden="true">${Array.from({length:f.packs/LOT()},()=>"<i></i>").join("")}</div>
      <div class="stepper sm"><button data-mv="${j}" data-d="-1" aria-label="${tx("1,000 fewer","1,000 कम")} ${esc(fname(f.i))}">−</button><b>${num(f.packs)}</b><button data-mv="${j}" data-d="1" aria-label="${tx("1,000 more","1,000 ज़्यादा")} ${esc(fname(f.i))}">+</button></div>
    </div>`}).join("");
  document.getElementById("csum").innerHTML = `

    <div><b>${inr(s.approval)}</b><span>${tx(`one-time approval (${c.n} × ₹${num(CONFIG.approvalFeePerFlavour)})`,`एक बार अप्रूवल (${c.n} × ₹${num(CONFIG.approvalFeePerFlavour)})`)}</span></div>
    <div><b>${lakh(s.retail)}</b><span>${tx(`retail value at ₹${c.mrp} MRP`,`₹${c.mrp} MRP पर रिटेल वैल्यू`)}</span></div>`;
  if(!c.flav.some(f=>f.i===S.view)) S.view = c.flav[0].i;
  document.getElementById("lp3").innerHTML = viewer3D(false); applyRot(); wireViewer();
  document.getElementById("pv").innerHTML = c.flav.map(f=>packHTML(f.i)).join("");
  document.getElementById("paytbl").innerHTML = `
    <tr><th>${tx("When","कब")}</th><th>${tx("What","क्या")}</th><th class="num">${tx("Amount","राशि")}</th></tr>
    <tr><td>${tx("Today","आज")}</td><td>${tx("Booking slot amount (10%)","स्लॉट बुकिंग राशि (10%)")}</td><td class="num">${inr(s.token)}</td></tr>
    <tr><td>${tx("After label design (day 15)","लेबल डिज़ाइन के बाद (दिन 15)")}</td><td>${tx("Second payment (40%), before approval and packaging start","दूसरा पेमेंट (40%), अप्रूवल और पैकेजिंग शुरू होने से पहले")}</td><td class="num">${inr(s.pre)}</td></tr>

    <tr><td>${tx("Before delivery","डिलीवरी से पहले")}</td><td>${tx("Final payment (50%)","फाइनल पेमेंट (50%)")}</td><td class="num">${inr(s.dispatch)}</td></tr>
    <tr><td colspan="2"><b>${tx("Total (GST extra as applicable)","कुल (GST अलग, लागू अनुसार)")}</b></td><td class="num"><b>${inr(s.invest)}</b></td></tr>`;
  document.getElementById("delay").innerHTML = tx(`<b>The cost of waiting:</b> at your current settings this batch earns an estimated ${inr(s.profit)} profit. Every month you delay booking pushes that profit — and your launch — a month further away.`,`<b>इंतज़ार की कीमत:</b> मौजूदा सेटिंग पर यह बैच लगभग ${inr(s.profit)} प्रॉफिट कमाता है। बुकिंग में हर महीने की देरी यह प्रॉफिट — और आपका लॉन्च — एक महीना आगे धकेलती है।`);
  refreshBar();
}
AFTER.launchpad = () => {
  const bud=document.getElementById("bud"), budn=document.getElementById("budn"), warn=document.getElementById("warn");
  const clampB=v=>Math.max(CONFIG.minBudget,Math.min(CONFIG.maxBudget,v||0));
  bud.addEventListener("input",()=>{ warn.textContent=""; setBudget(+bud.value); renderCalc(); });
  budn.addEventListener("change",()=>{ const v=parseInt(budn.value.replace(/\D/g,""),10)||0; warn.textContent = v<CONFIG.minBudget ? tx(`Minimum launch order is ${inr(CONFIG.minBudget)} (${num(CONFIG.minPacks)} packs). We have set it for you.`,`न्यूनतम लॉन्च ऑर्डर ${inr(CONFIG.minBudget)} (${num(CONFIG.minPacks)} पैक) है। हमने इसे सेट कर दिया है।`) : v>CONFIG.maxBudget ? tx(`For budgets above ${inr(CONFIG.maxBudget)}, book a slot and our team will plan it with you.`,`${inr(CONFIG.maxBudget)} से ज़्यादा बजट के लिए स्लॉट बुक करें, हमारी टीम आपके साथ प्लान करेगी।`) : ""; setBudget(clampB(v)); budn.value=num(S.calc.budget); renderCalc(); });
  budn.addEventListener("keydown",e=>{ if(e.key==="Enter") budn.blur(); });
  document.querySelector(".calc").addEventListener("click",e=>{
    const p=e.target.closest("[data-preset]"); if(p){ warn.textContent=""; setBudget(+p.dataset.preset); renderCalc(); return; }
    const t=e.target.closest("[data-tot]"); if(t){ const before=S.calc.total; setTotal(S.calc.total + (+t.dataset.tot)*LOT());
      warn.textContent = S.calc.total===before && +t.dataset.tot<0 ? tx(`Minimum launch order is ${num(minTotal())} packs (${inr(orderFor(minTotal()))}).`,`न्यूनतम लॉन्च ऑर्डर ${num(minTotal())} पैक (${inr(orderFor(minTotal()))}) है।`) : ""; renderCalc(); return; }
    const tt=e.target.closest("[data-tt]"); if(tt){ warn.textContent=""; setTotal(+tt.dataset.tt); renderCalc(); return; }
    const nf=e.target.closest("[data-nf]"); if(nf){ warn.textContent=""; setFlavourCount(+nf.dataset.nf); renderCalc(); return; }
    const mv=e.target.closest("[data-mv]"); if(mv){ const r=moveLot(+mv.dataset.mv, +mv.dataset.d);
      warn.innerHTML = r==="need" ? tx(`Every other flavour is at the 1,000 minimum. <button class="minibtn" data-tot="1">Add 1,000 packs (+${inr(orderFor(S.calc.total+LOT())-orderFor(S.calc.total))})</button>`,`बाकी सभी फ्लेवर 1,000 के न्यूनतम पर हैं। <button class="minibtn" data-tot="1">1,000 पैक जोड़ें (+${inr(orderFor(S.calc.total+LOT())-orderFor(S.calc.total))})</button>`) : r==="min" ? tx("Each flavour needs at least 1,000 packs (one print lot).","हर फ्लेवर के कम से कम 1,000 पैक (एक प्रिंट लॉट) चाहिए।") : "";
      if(!r) renderCalc(); return; }
    const pv=e.target.closest("[data-pv]"); if(pv){ S.view=+pv.dataset.pv; save(); document.getElementById("v3").innerHTML=pack3D(S.view); applyRot(); document.querySelectorAll("[data-pf]").forEach(x=>x.setAttribute("aria-pressed",String(+x.dataset.pf===S.view))); return; }
    const bl=e.target.closest('[data-act="balance"]'); if(bl){ e.stopPropagation(); warn.textContent=""; balance(); renderCalc(); }
  });
  renderCalc();
};

   ["Who owns the brand?","ब्रांड का मालिक कौन?","You do. The brand name, artwork and your customers are yours. We recommend filing a trademark for your brand name early.","आप। ब्रांड नाम, आर्टवर्क और आपके ग्राहक आपके हैं। हम ब्रांड नाम का ट्रेडमार्क जल्दी फाइल करने की सलाह देते हैं।"],
   ["Who designs my label?","मेरा लेबल कौन डिज़ाइन करेगा?","Our team designs it with you in the first 15 days. You approve the final artwork before anything is printed.","हमारी टीम पहले 15 दिनों में आपके साथ डिज़ाइन करती है। प्रिंट से पहले फाइनल आर्टवर्क आप अप्रूव करते हैं।"],
   ["Will you help me sell?","क्या आप बेचने में मदद करेंगे?","You get the influencer plan in this portal, listing guidance and compliant copy based on what works for Royal Swag. Selling and marketing spend remain with your brand.","आपको इस पोर्टल का इन्फ्लुएंसर प्लान, लिस्टिंग गाइडेंस और Royal Swag के अनुभव पर आधारित सही कॉपी मिलती है। बिक्री और मार्केटिंग खर्च आपके ब्रांड का रहता है।"],
   ["How fast are reorders?","रीऑर्डर कितनी जल्दी होता है?",`About ${CONFIG.packagingDays+s.md+CONFIG.dispatchDays} days for your batch size, because approval and label design are already done.`,`आपके बैच साइज़ के लिए लगभग ${CONFIG.packagingDays+s.md+CONFIG.dispatchDays} दिन, क्योंकि अप्रूवल और लेबल डिज़ाइन पहले से हो चुके होते हैं।`]
  ].map(q=>`<details><summary>${tx(q[0],q[1])}</summary><p>${tx(q[2],q[3])}</p></details>`).join("")}`;
};
function planLines(){
  const s=summary(), c=S.calc;
  return [`Plan: ${num(s.packs)} packs × ₹${s.p} = ${inr(s.order)} | Flavours: ${c.n}`,`Packs: ${c.flav.map(x=>`${FLAVOURS[x.i].en} ${num(x.packs)}`).join(", ")}`,`Total packs: ${num(s.packs)}`,`Order value: ${inr(s.order)} + approval ${inr(s.approval)} + GST`,`Booking slot amount (10%): ${inr(s.token)}`];
}
function bookingText(b){
  return [`Eximburg brand booking ${b.id}`,`Name: ${b.name}`,`Mobile: ${b.phone}`,`Brand: ${b.brand||"-"}`,`City: ${b.city||"-"}`,`GSTIN: ${b.gst||"-"}`,`Call time: ${b.time}`,...b.plan].join("\n");
}
function sendLinks(subject, txt, primary){
  const wa = CONFIG.whatsapp ? `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(txt)}` : "";
  const mail = `mailto:${CONFIG.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(txt)}`;
  return `${wa?`<a class="btn btn-leaf" href="${wa}" target="_blank" rel="noopener">${tx("Send on WhatsApp","WhatsApp पर भेजें")}</a>`:""}<a class="btn ${wa||!primary?"btn-ghost":"btn-primary"}" href="${mail}">${tx("Send by email","ईमेल से भेजें")}</a>`;
}
function bookedView(){
  const b=S.booking, txt=bookingText(b);
  return `
  <h1>${tx(`Congratulations — ${esc(b.brand||brand())} is on its way.`,`बधाई हो — ${esc(b.brand||brand())} की शुरुआत हो गई।`)}</h1>
  <div class="panel success">
    <p class="muted" style="margin:0">${tx("Booking ID","बुकिंग ID")}</p>
    <div class="bookid">${esc(b.id)}</div>
    <p>${tx("Send it to Eximburg now to reserve your slot. Our team replies within one working day with the official payment details for the booking slot amount.","स्लॉट रिज़र्व करने के लिए इसे अभी Eximburg को भेजें। हमारी टीम एक कार्य-दिवस में स्लॉट बुकिंग राशि की आधिकारिक पेमेंट डिटेल के साथ जवाब देगी।")}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${sendLinks("Brand booking "+b.id+" – "+(b.brand||b.name), txt, true)}<button class="btn btn-ghost" data-act="copy">${tx("Copy booking details","बुकिंग डिटेल कॉपी करें")}</button></div>
    <p class="muted small" id="copied" role="status" style="margin:10px 0 0"></p>
  </div>
  <div class="tablewrap"><table>${b.plan.map(l=>`<tr><td>${esc(l)}</td></tr>`).join("")}</table></div>
  <button class="btn btn-ghost" data-act="rebook">${tx("Start a new booking","नई बुकिंग शुरू करें")}</button>`;
}
AFTER.book = () => {
  startTicker();
  const f=document.getElementById("bf"); if(!f) return;
  f.addEventListener("submit",e=>{ e.preventDefault();
    const p=bp.value.replace(/\D/g,""), err=document.getElementById("e-b");
    if(!bn.value.trim()){ err.textContent=tx("Enter your full name.","पूरा नाम लिखें।"); return; }
    if(!/^[6-9]\d{9}$/.test(p)){ err.textContent=tx("Enter a valid 10-digit mobile number.","सही 10 अंकों का मोबाइल नंबर लिखें।"); return; }
    if(!bk.checked){ err.textContent=tx("Please tick the confirmation box.","कृपया कन्फर्मेशन बॉक्स पर टिक करें।"); return; }
    const d=new Date(), id="EXB-"+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+Math.random().toString(36).slice(2,6).toUpperCase();
    S.user.brand = bb.value.trim() || S.user.brand;
    S.booking={ id, name:bn.value.trim(), phone:p, brand:bb.value.trim(), city:bc.value.trim(), gst:bg.value.trim(), time:bt.value, plan:planLines() };
    save(); render(); window.scrollTo({top:0});
  });
};

/* ---------------- global events ---------------- */
root.addEventListener("click", e=>{
  const l=e.target.closest("[data-lang]"); if(l){ S.lang=l.dataset.lang; save(); render(); return; }
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act, side=document.getElementById("side"), scrim=document.querySelector(".scrim");
  if(act==="menu"){ side.classList.add("open"); scrim.classList.add("show"); }
  if(act==="close"){ side.classList.remove("open"); scrim.classList.remove("show"); }
  if(act==="lid"){ S.lidOpen=!S.lidOpen; save(); document.querySelectorAll(".p3").forEach(p=>p.classList.toggle("open",S.lidOpen)); a.textContent = S.lidOpen?tx("Close the pack","पैक बंद करें"):tx("Open the pack","पैक खोलें"); }
  if(act==="logout"){ S.user=null; S.booking=null; S.visited=[]; S.current="home"; save(); if(window.portalLogout) window.portalLogout(); else location.replace("home.html"); }
  if(act==="copy-id" && S.user && S.user.loginId){ const done=()=>{ a.textContent=tx("Copied","कॉपी हो गया"); setTimeout(()=>{ a.textContent=S.user.loginId; }, 1200); };
    try{ navigator.clipboard.writeText(S.user.loginId).then(done,()=>{}); }catch(err){} }
  if(act==="rebook"){ S.booking=null; save(); render(); }
  if(act==="call"){ const u=S.user, t=bt?bt.value:"";
    const txt=[`Call request – Eximburg brand portal`,`Name: ${u.name}`,`Mobile: ${u.phone}`,`Brand: ${u.brand||"-"}`,`City: ${u.city||"-"}`,`Preferred time: ${t}`,...planLines()].join("\n");
    document.getElementById("callres").innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap">${sendLinks("Call request – "+(u.brand||u.name), txt, false)}</div>`; }
  if(act==="copy"){ const t=bookingText(S.booking); const done=()=>{document.getElementById("copied").textContent=tx("Copied. Paste it into WhatsApp or email to Eximburg.","कॉपी हो गया। इसे WhatsApp या ईमेल में Eximburg को भेजें।");};
    try{ navigator.clipboard.writeText(t).then(done,()=>{}); }catch(err){} }
});
window.startPortal = function (profile) {
  S.user = {
    name: profile.name,
    email: profile.email,
    phone: profile.phone || "",
    city: profile.city || "",
    brand: profile.brand || "",
    role: "user",
    loginId: profile.loginId || ""
  };
  if (S.visited.length > 1) S.returning = true;
  save();
  render();
  const notice = sessionStorage.getItem("exb_notice");
  if (notice) {
    sessionStorage.removeItem("exb_notice");
    const sec = document.getElementById("sec");
    if (sec) {
      const note = document.createElement("div");
      note.className = "note leaf";
      note.textContent = notice;
      sec.prepend(note);
    }
  }
};

</script>
