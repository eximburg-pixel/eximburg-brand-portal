[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = "js/src/firebase-config.js,js/dist/portal-data.js,js/dist/portal-data.js.map"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 302

[[redirects]]
  from = "/index.html"
  to = "/user.html"
  status = 302

# The Admin, Production and Account dashboards are now one page: team.html.
# Old links and bookmarks go there. Who may open it is decided by js/dist/guard.js
# from the role stored in Netlify, and (in later steps) by Firestore rules and server checks.
[[redirects]]
  from = "/admin.html"
  to = "/team.html"
  status = 302

[[redirects]]
  from = "/sales.html"
  to = "/team.html"
  status = 302

[[redirects]]
  from = "/production.html"
  to = "/team.html"
  status = 302

# Every page: stop clickjacking and MIME sniffing. Do not add a Content-Security-Policy
# here — user.html and team.html run large inline scripts, and a CSP would break them.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Staff page: keep it out of search results and do not cache it.
[[headers]]
  for = "/team.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
