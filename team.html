<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F2A24">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<title>Eximburg — Team panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3EE; --surface:#FFFFFF; --ink:#1F2A24; --muted:#5B675F; --line:#DAD9CF;
  --rose:#A8324F; --rose-soft:#F6E4E9; --leaf:#3F6B35; --leaf-soft:#E4EEDF; --gold:#B87F0C; --gold-soft:#FBF1D9;
  --side:#1F2A24; --side-ink:#E9EEE8; --side-muted:#9FB0A5;
  --display:'Poppins','Mukta',system-ui,sans-serif; --body:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#131A16; --surface:#1B241F; --ink:#E9EEE8; --muted:#A1AEA5; --line:#2E3B34;
  --rose:#E3748E; --rose-soft:#3A2129; --leaf:#8DC27B; --leaf-soft:#22321F; --gold:#E7B84E; --gold-soft:#372C14;
  --side:#0E1310; --side-ink:#E9EEE8; --side-muted:#8A9A90; } }
:root[data-theme="dark"]{
  --bg:#131A16; --surface:#1B241F; --ink:#E9EEE8; --muted:#A1AEA5; --line:#2E3B34;
  --rose:#E3748E; --rose-soft:#3A2129; --leaf:#8DC27B; --leaf-soft:#22321F; --gold:#E7B84E; --gold-soft:#372C14;
  --side:#0E1310; --side-ink:#E9EEE8; --side-muted:#8A9A90; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;min-height:100%;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.015em;line-height:1.2;margin:0 0 .4em}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
a{color:var(--leaf)}
.muted{color:var(--muted)}.small{font-size:.88rem}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:9px 18px;font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--rose);color:#fff}.btn-leaf{background:var(--leaf);color:#fff}
:root[data-theme="dark"] .btn-leaf{color:#10160f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-leaf{color:#10160f}}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{padding:5px 12px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* login */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px)}
.auth-art{background:var(--side);color:var(--side-ink);padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.auth-art .bm{font-family:var(--display);font-weight:700;font-size:1.3rem}
.auth-art h1{font-size:clamp(1.7rem,3vw,2.3rem);max-width:18ch}
.auth-art ul{list-style:none;padding:0;margin:0;display:grid;gap:12px;max-width:44ch}
.auth-art li{display:grid;grid-template-columns:118px 1fr;gap:12px;color:var(--side-muted)}
.auth-art li b{color:var(--side-ink);font-weight:600}
.auth-form{padding:48px clamp(24px,5vw,56px);display:flex;flex-direction:column;justify-content:center}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-art{padding:28px 22px}.auth-art ul{display:none}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-weight:600;font-size:.9rem}
.field input,.field select,.field textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.98rem;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--leaf);outline:none}
.field textarea{min-height:70px;resize:vertical}
.formerr{background:var(--rose-soft);color:var(--rose);border-radius:10px;padding:9px 13px;margin:0 0 12px;font-size:.92rem}
.formerr:empty{display:none}
.democreds{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-top:18px;font-size:.9rem}
.democreds table{width:100%;border-collapse:collapse;margin-top:6px}
.democreds td{padding:3px 6px 3px 0}
.linkbtn{background:none;border:0;padding:0;color:var(--leaf);text-decoration:underline;cursor:pointer;font-weight:600}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.side .bm{font-family:var(--display);font-weight:700;font-size:1.15rem;padding:0 10px}
.side .bm small{display:block;font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--side-muted)}
.tabs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tabs button{width:100%;text-align:left;background:none;border:0;color:var(--side-muted);padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500}
.tabs button:hover{color:var(--side-ink);background:rgba(255,255,255,.05)}
.tabs button[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--side-ink);font-weight:600}
.tabs em{font-style:normal;margin-left:auto;background:var(--rose);color:#fff;border-radius:999px;font-size:.72rem;padding:0 7px;line-height:1.6}
.side .who{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:.88rem;color:var(--side-muted)}
.side .who b{color:var(--side-ink);display:block}
.side .who button{background:none;border:0;color:var(--side-muted);text-decoration:underline;cursor:pointer;padding:0;margin-top:6px}
.rolechip{display:inline-block;border-radius:999px;font-size:.72rem;font-weight:600;padding:1px 8px;background:var(--gold);color:#1F2A24;text-transform:capitalize;margin-top:4px}
.main{padding:26px clamp(16px,3vw,36px) 60px;min-width:0}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.mhead p{margin:0}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:20;padding:10px 12px;gap:8px;flex-direction:row;align-items:center;overflow-x:auto}
  .side .bm small,.side .who{display:none}
  .tabs{flex-direction:row}.tabs button{white-space:nowrap;padding:7px 10px}
}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;min-width:0}
.card>h2,.card>h3{margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;color:var(--muted);font-size:.85rem}
.kpi b{display:block;font-family:var(--display);font-weight:600;font-size:1.65rem;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi small{color:var(--muted);font-size:.8rem}
.kpi.alert{border-color:var(--rose);background:var(--rose-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
@media (max-width:700px){.grid3{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=search],.toolbar select{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;min-width:220px}

.funnel{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:12px;align-items:center;font-size:.92rem}
.fbar{height:24px;background:var(--bg);border-radius:6px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--leaf);border-radius:6px;min-width:2px}
.frow b{font-variant-numeric:tabular-nums;text-align:right}
.frow b small{color:var(--muted);font-weight:400;display:block;font-size:.75rem}
@media (max-width:560px){.frow{grid-template-columns:110px 1fr 70px}}
.spark{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.spark i{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
.spark span{font-size:.68rem;color:var(--muted);white-space:nowrap}
.spark b{font-size:.72rem;font-weight:600}

.slotrow{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 4px}
.slotrow i{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:600;border:1.5px solid var(--line);color:var(--muted)}
.slotrow i.rs{background:var(--side);color:var(--side-ink);border-color:var(--side)}
.slotrow i.off{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.slotrow i.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.slotrow i.hold{background:var(--rose-soft);border-color:var(--rose);color:var(--rose)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.82rem;background:var(--bg);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
td .sub{display:block;color:var(--muted);font-size:.82rem}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:600;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.pill.due{background:var(--rose-soft);color:var(--rose);border-color:transparent}
.pill.wait{background:var(--gold-soft);color:var(--ink);border-color:transparent}
.pill.ok{background:var(--leaf-soft);color:var(--leaf);border-color:transparent}
.pill.dim{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}

.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted);font-size:.8rem;white-space:nowrap}

/* payments */
.paycard{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px}
.paycard dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;margin:10px 0}
.paycard dt{color:var(--muted);font-size:.86rem}.paycard dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.mismatch{color:var(--rose);font-weight:600}
.slipbox{border:1px dashed var(--line);border-radius:12px;min-height:150px;display:grid;place-items:center;padding:8px;text-align:center}
.slipbox img{max-width:100%;max-height:320px;border-radius:8px;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.actions input{flex:1 1 200px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px}
@media (max-width:760px){.paycard{grid-template-columns:1fr}.paycard dl{grid-template-columns:110px 1fr}}

/* production board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:200px}
.col h3{font-size:.92rem;display:flex;justify-content:space-between;gap:6px}
.col h3 span{color:var(--muted);font-weight:500}
.col.wait{background:transparent;border-style:dashed}
.job{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:var(--bg);font-size:.9rem;cursor:pointer}
.job b{display:block;font-family:var(--display);font-weight:600}
.job .btn{margin-top:8px;width:100%;white-space:normal;text-align:center}
.job .pill{white-space:normal}

/* drawer + dialog */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:41;overflow-y:auto;padding:22px 24px calc(40px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 40px rgba(0,0,0,.2)}
.drawer .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.xbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:1.2rem;flex:none}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 12px;margin:0;font-size:.93rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
dialog{border:1px solid var(--line);border-radius:16px;padding:22px;background:var(--surface);color:var(--ink);width:min(440px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,14,12,.45)}

/* settings */
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.titem{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--bg)}
.titem summary{cursor:pointer;font-weight:600;margin-top:4px}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}

.toastbox{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--side);color:var(--side-ink);border-radius:12px;padding:11px 14px;box-shadow:0 10px 28px rgba(0,0,0,.22);font-size:.92rem;animation:tin .3s ease}
.toast small{display:block;color:var(--side-muted)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.demopill{position:fixed;right:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:30;background:var(--gold-soft);border:1px solid var(--gold);border-radius:999px;padding:4px 12px;font-size:.78rem;pointer-events:none}
.livedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3FB950;box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:lp 1.8s infinite;vertical-align:middle}
@keyframes lp{70%{box-shadow:0 0 0 8px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
@media (prefers-reduced-motion:reduce){.livedot{animation:none}}
.livebar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:14px}
.actfeed li{grid-template-columns:minmax(0,1fr) auto;align-items:start}
.actfeed li.fresh{background:var(--leaf-soft);margin:0 -12px;padding:8px 12px;border-radius:8px}
.kind{display:inline-block;font-size:.72rem;font-weight:600;border-radius:6px;padding:1px 7px;margin-right:4px;background:var(--bg);border:1px solid var(--line);color:var(--muted);vertical-align:1px}
.k-bookings,.k-payments{background:var(--gold-soft);border-color:transparent;color:var(--ink)}
.k-accounts{background:var(--leaf-soft);border-color:transparent;color:var(--leaf)}
.k-team{background:var(--side);border-color:transparent;color:var(--side-ink)}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:3px solid var(--line)}
.tl li{position:relative;padding:0 0 14px}
.tl li::before{content:"";position:absolute;left:-31px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.tl li.done::before{background:var(--leaf);border-color:var(--leaf)}
.tl li.cur::before{border-color:var(--rose);background:var(--rose-soft)}
.tl li.hold::before{border-color:var(--gold);background:var(--gold-soft)}
.tlh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.drop{position:relative;display:block;border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer}
.drop:hover,.drop.has{border-color:var(--leaf);background:var(--leaf-soft)}
.drop:focus-within{outline:2px solid var(--leaf);outline-offset:2px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.boot{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
</style>
</head>
<body data-portal="team">
<div id="app"><div class="boot" role="status">Checking your account…</div></div>
<script>
window.addEventListener("error", function(e){ var r=document.getElementById("root")||document.getElementById("app");
  if(r && (!r.children.length || r.querySelector(".boot,.bootload"))) r.innerHTML='<div style="max-width:560px;margin:15vh auto;padding:24px;font-family:system-ui;border:1px solid #DAD9CF;border-radius:14px;background:#fff;color:#1F2A24"><h2 style="margin-top:0">This page could not start</h2><p>'+String(e.message||"Unknown error").replace(/</g,"&lt;")+'</p><p style="color:#5B675F">Reload the page. If it keeps happening, send this message to the developer.</p></div>'; });
</script>
<script src="js/dist/portal-data.js"></script>
<script>
"use strict";
const DBX = window.ExbDB, DB = DBX.create("admin"), app = document.getElementById("app");
const STAFF = ["admin","accounts","production"];
const TABS = {
  overview:   {t:"Overview",          d:"Visitors, sign-ups, bookings and money collected."},
  leads:      {t:"Leads & activity",  d:"Everyone who created an account, and what they did in the portal."},

  dispatchdesk:{t:"Dispatch desk",    d:"After the 50% is verified: set shipping, then add the tax invoice and e-way bill to clear the order for dispatch."},
  schedule:   {t:"Order timeline",    d:"Planned and actual dates for every order, through to dispatch."},
  settings:   {t:"Settings",          d:"Slots, price lock, bank and UPI details, offer and brand testimonials."},
  team:       {t:"Team",              d:"Give staff members Admin, Accounts or Production access."}
};
const ROLE_TABS = { admin:["overview","activity","leads","bookings","payments","dispatchdesk","production","schedule","settings","team"], accounts:["overview","payments","dispatchdesk","bookings","leads"], production:["production","schedule"] };
const SECTION_NAMES = { home:"Dashboard", what:"Herbal Cigarettes", market:"Market size", future:"Future scope", target:"Target customers", about:"About Eximburg",
  brands:"Brands we built", benefits:"Why this business", launchpad:"Brand launchpad", profit:"Profit plan", influencer:"Influencer plan", process:"Manufacturing process",
  mindset:"Business mindset", book:"Book your slot", orders:"My orders" };
const PROD_COLS = ["confirmed","label_design","approval_packaging","manufacturing","qc","ready_dispatch","dispatched"];
const HOLD = ["awaiting_40","awaiting_50","shipping_quote","awaiting_shipping","docs_pending"];
let PRODVIEW = false;   /* true on Production screens: no money wording for any login */
/* production never sees payment wording */
const PROD_NAMES = { confirmed:"New order: start label", label_design:"Label design", awaiting_40:"On hold: waiting for clearance", approval_packaging:"Govt approval + packaging",
  manufacturing:"Manufacturing", qc:"Quality check", awaiting_50:"On hold: waiting for dispatch clearance", shipping_quote:"On hold: waiting for dispatch clearance", awaiting_shipping:"On hold: waiting for dispatch clearance",
  docs_pending:"On hold: invoice & e-way bill being prepared", ready_dispatch:"Ready to dispatch", dispatched:"Dispatched", delivered:"Delivered" };
const MOVE_LABEL = { label_design:"Start label design", awaiting_40:"Label approved: send for clearance", manufacturing:"Packaging ready: start manufacturing",
  qc:"Manufacturing done: start QC", awaiting_50:"QC passed: send for dispatch clearance", dispatched:"Mark as dispatched", delivered:"Mark as delivered" };

let ME = null, D = null, SET = null, SLOTS = null, TAB = "overview", DRAWER = null, loadErr = "";
const Q = { actf:"all", range:30, leadq:"", leadf:"all", bkf:"active", bkm:"", payf:"submitted" };
const slipCache = {};

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr = n => "₹" + Math.round(Number(n)||0).toLocaleString("en-IN");
const num = n => Math.round(Number(n)||0).toLocaleString("en-IN");
const lakh = n => "₹" + ((Number(n)||0)/100000).toLocaleString("en-IN",{maximumFractionDigits:2}) + " L";
const fmtDT = iso => iso ? new Date(iso).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}) : "–";
const fmtD = iso => iso ? new Date(iso).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}) : "–";
function ago(iso){ if(!iso) return "–"; const s=Math.max(1,(Date.now()-new Date(iso))/1000); if(s<90) return "just now"; const m=s/60; if(m<60) return Math.round(m)+" min ago"; const h=m/60; if(h<36) return Math.round(h)+" h ago"; return Math.round(h/24)+" days ago"; }
const monthLabel = k => { if(!k) return ""; const [y,m]=k.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("en-IN",{month:"short",year:"numeric"}); };
const stage = k => ((PRODVIEW || (ME && ME.role==="production")) && PROD_NAMES[k]) ? PROD_NAMES[k] : (DBX.STAGES.find(s=>s.k===k)||{en:k}).en;
const msLabel = k => (DBX.MILESTONES[k]||{en:k}).en;
const holdExpired = b => b.stage==="awaiting_payment" && new Date(b.hold_until) < new Date();
function stagePill(b){
  if(holdExpired(b)) return `<span class="pill dim">Hold expired</span>`;
  const who=(DBX.STAGES.find(s=>s.k===b.stage)||{}).who;
  const c = b.stage==="cancelled"?"dim" : HOLD.includes(b.stage)&&(PRODVIEW||ME&&ME.role==="production")?"wait" : who==="customer"?"due" : b.stage==="payment_review"?"wait" : "ok";
  return `<span class="pill ${c}">${esc(stage(b.stage))}</span>`;
}
const payPill = p => p.status==="verified"?`<span class="pill ok">Verified</span>`:p.status==="rejected"?`<span class="pill due">Rejected</span>`:`<span class="pill wait">To verify</span>`;
const can = (...roles) => ME && roles.includes(ME.role);
function toast(msg, sub){ let b=document.querySelector(".toastbox"); if(!b){ b=document.createElement("div"); b.className="toastbox"; b.setAttribute("aria-live","polite"); document.body.appendChild(b); }
  const t=document.createElement("div"); t.className="toast"; t.innerHTML=`${msg}${sub?`<small>${sub}</small>`:""}`; b.appendChild(t); setTimeout(()=>t.remove(), 7000); }
function inRange(iso){ return Q.range===0 || (Date.now()-new Date(iso)) <= Q.range*864e5; }
function wa(phone){ const p=String(phone||"").replace(/\D/g,"").slice(-10); return p ? `https://wa.me/91${p}` : ""; }

/* ---------- derived data ---------- */
function derive(){
  const P = {}; D.profiles.forEach(p=>P[p.id]=Object.assign(p,{ev:[],bk:[],sections:new Set(),plan:null,last:p.created_at}));
  D.events.slice().reverse().forEach(e=>{ const p=P[e.user_id]; if(!p) return; p.ev.push(e);
    if(e.created_at > p.last) p.last = e.created_at;
    if(e.type==="section_view" && e.meta) p.sections.add(e.meta.id);
    if(e.type==="plan_change" && e.meta) p.plan = e.meta; });
  D.bookings.forEach(b=>{ b.pay = D.payments.filter(x=>x.booking_id===b.id); b.upd = D.updates.filter(x=>x.booking_id===b.id).sort((a,c)=>String(a.created_at).localeCompare(String(c.created_at)));
    if(P[b.user_id]) P[b.user_id].bk.push(b); });
  D.P = P;
  D.customers = D.profiles.filter(p=>p.role==="customer");
}
/* Production board and Order timeline (and Admin on those tabs) read only the money-free factory copy. */
function factoryOrders(){
  if(D.productionOnly) return D.bookings;
  const rows = D.factory || [], ups = D.factoryUpdates || [];
  return rows.map(b => ({ ...b, pay: [], upd: ups.filter(u=>u.booking_id===b.id).sort((a,c)=>String(a.created_at).localeCompare(String(c.created_at))) }));
}
function boardOrders(){ return PRODVIEW ? factoryOrders() : D.bookings; }
function leadStatus(p){
  const bk = p.bk.filter(b=>b.stage!=="cancelled" && !holdExpired(b)); if(!bk.length) return p.bk.length ? ["Slot lapsed","due"] : p.sections.has("book") ? ["Opened booking","wait"] : p.plan ? ["Planning","wait"] : ["Signed up","dim"];
  const idx = Math.max(...bk.map(b=>DBX.stageIndex(b.stage)));
  if(idx>=DBX.stageIndex("delivered")) return ["Delivered","ok"];
  if(idx>=DBX.stageIndex("confirmed")) return ["In production","ok"];
  if(idx>=DBX.stageIndex("payment_review")) return ["Slip uploaded","wait"];
  return ["Booked, unpaid","due"];
}
function evText(e){ const m=e.meta||{};
  switch(e.type){
    case "visit": return "Visited the portal"+(m.mobile?" (mobile)":"");
    case "signup": return "Created an account";
    case "login": return "Signed in";
    case "section_view": return "Opened "+(SECTION_NAMES[m.id]||m.id);
    case "plan_change": return `Set plan to ${num(m.packs)} packs, ${lakh(m.order)}, ${m.flavours} flavours`;
    case "offer_upgrade": return `Upgraded to ${num(m.packs)} packs for the offer`;
    case "slot_booked": return `Booked a slot (${esc(m.code||"")})`;
    case "payment_submitted": return `Uploaded payment slip ${inr(m.amount)} (${msLabel(m.milestone)})`;
    case "call_request": return "Requested a call";
    default: return e.type;
  }
}

/* ---------- load & live ---------- */
let LAST_LOAD = 0, LAST_SEEN_T = "";
async function loadAll(){
  LAST_LOAD = Date.now();
  const [d, s, sl] = await Promise.all([DB.staffData(), DB.getSettings(), DB.slotStatus()]);
  const prev = D; D = d; SET = s; SLOTS = sl; derive();
  if(prev){
    const newPays = D.payments.filter(p=>p.status==="submitted" && !prev.payments.some(x=>x.id===p.id));
    const newBk = D.bookings.filter(b=>!prev.bookings.some(x=>x.id===b.id));
    const newCust = D.customers.filter(c=>!prev.profiles.some(x=>x.id===c.id));
    if(newPays.length && can("admin","accounts")) toast(`New payment slip: ${newPays.length}`, "Open Payments to verify.");
    if(newBk.length) toast(ME.role==="production" ? `New order cleared for production: ${esc(newBk[0].brand||newBk[0].name)}` : `New slot booked: ${esc(newBk[0].brand||newBk[0].name)}`, `${esc(newBk[0].code)}, ${num(newBk[0].packs)} packs, slot ${newBk[0].slot_no} ${monthLabel(newBk[0].slot_month)}`);
    if(newCust.length && can("admin")) toast(`New sign-up: ${esc(newCust[0].name)}`, esc(newCust[0].city||""));
  }
}
let liveT=null;
function onLive(){ clearTimeout(liveT); liveT=setTimeout(async ()=>{ try{ await loadAll(); softRender(); }catch(e){} }, 800); }
function softRender(){
  const a=document.activeElement;
  if(TAB==="settings" || (TAB==="dispatchdesk" && [...document.querySelectorAll("form.docform input,[id^=sa-],[id^=sn-]")].some(i=>i.value && i.type!=="date")) || (a && a.matches && a.matches("input,textarea,select") && !a.closest(".toolbar"))) return;
  const y=window.scrollY, dy=document.querySelector(".drawer")?.scrollTop; render(); window.scrollTo(0,y); const dr=document.querySelector(".drawer"); if(dr && dy) dr.scrollTop=dy;
}

/* ---------- fatal message (login itself is handled by Netlify) ---------- */
function renderFatal(msg){
  app.innerHTML = `<div class="boot"><div class="card" style="max-width:460px;text-align:center">
    <h2>The team panel could not open</h2><p class="muted">${esc(msg||"Your session ended. Sign in again.")}</p>
    <button class="btn btn-ghost" id="so">Sign out</button></div></div>`;
  document.getElementById("so").onclick = async ()=>{ try{ await DB.signOut(); }catch(e){ location.replace("home.html"); } };
}
async function enter(){
  if(!ME || !STAFF.includes(ME.role)) return renderFatal("This account has no staff access.");
  try{ await loadAll(); }catch(e){ loadErr=e.message; return renderFatal(e.message); }
  TAB = {admin:"overview", accounts:"payments", production:"production"}[ME.role];
  if(ME.role==="accounts" && !D.payments.some(p=>p.status==="submitted") && D.bookings.some(b=>["shipping_quote","docs_pending"].includes(b.stage))) TAB="dispatchdesk";
  LAST_SEEN_T = new Date().toISOString();
  render();
  if(!window._exbSub){ window._exbSub=true; try{ DB.subscribe(onLive); }catch(e){} setInterval(()=>{ if(document.visibilityState==="visible" && ME && STAFF.includes(ME.role) && (TAB==="activity" || ME.role==="production" || Date.now()-LAST_LOAD>45000)) onLive(); }, 12000); }
}

VIEWS.overview = () => {

  const openedBook = has(c=>D.P[c.id].sections.has("book") || D.P[c.id].bk.length);
  const booked = has(c=>D.P[c.id].bk.length);
  const slipped = has(c=>D.P[c.id].bk.some(b=>b.pay.length));

  const steps = [["Visitors",visits],["Created account",cust.length],["Planned a batch",planned],["Opened booking",openedBook],["Booked a slot",booked],["Uploaded slip",slipped],["Payment verified",verified]];
  const top = Math.max(1, ...steps.map(s=>s[1]));

  const collected = D.payments.filter(p=>p.status==="verified" && inRange(p.reviewed_at||p.created_at)).reduce((a,p)=>a+Number(p.amount),0);

  const pipeline = D.bookings.filter(b=>DBX.isActive(b) && b.stage!=="delivered").reduce((a,b)=>a+Number(b.order_value),0);
  const days = [...Array(14)].map((_,i)=>{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-13+i); return d; });
  const perDay = days.map(d=>{ const n=new Date(d); n.setDate(n.getDate()+1); return D.customers.filter(c=>new Date(c.created_at)>=d && new Date(c.created_at)<n).length; });

};
function slotRow(month, offline, isNext){
  const client = SLOTS.client_slots, rs = Math.max(0,(SET.monthSlots||15)-client);
  const bks = D.bookings.filter(b=>b.slot_month===month && DBX.isActive(b));
  let cells = ""; for(let i=0;i<rs;i++) cells += `<i class="rs" title="Royal Swag">RS</i>`;
  for(let k=1;k<=client;k++){ const b=bks.find(x=>x.slot_no===k);
    if(k<=offline) cells += `<i class="off" title="Booked offline">${k}</i>`;
    else if(b) cells += `<i class="${b.stage==="awaiting_payment"?"hold":"on"}" title="${esc(b.code)} ${esc(b.brand||b.name)}">${k}</i>`;
    else cells += `<i title="Open">${k}</i>`; }
  const used = offline + bks.filter(b=>b.slot_no>offline).length;
  return `<h3 style="margin:10px 0 0">${monthLabel(month)}${isNext?" (next)":""} <span class="muted small">${Math.max(0,client-used)} of ${client} open</span></h3><div class="slotrow">${cells}</div>`;
}

function slipView(id){ const s=slipCache[id]; return s.pdf ? `<div><p class="muted small">PDF slip</p><button class="btn btn-ghost btn-sm" data-openslip="${id}">Open PDF</button></div>` : `<a href="${s.url}" target="_blank" rel="noopener"><img src="${s.url}" alt="Payment slip"></a>`; }
async function loadSlip(id){
  const p = D.payments.find(x=>x.id===id); const box=document.getElementById("sl-"+id); if(box) box.textContent="Loading slip…";
  try{ let url = await DB.slipUrl(p.slip_path); if(!url) throw new Error("Slip file not found.");
    const pdf = /\.pdf(\?|$)/i.test(p.slip_path) || /^data:application\/pdf/.test(url) || /\.pdf\?/i.test(url);
    if(url.startsWith("data:")) url = URL.createObjectURL(await (await fetch(url)).blob());
    slipCache[id] = {url, pdf}; if(box) box.innerHTML = slipView(id);
  }catch(e){ if(box) box.textContent = e.message; }
}

function prodKpis(){

/* planned vs actual timeline (no money) */
function plan(b){
  const T = Object.assign({labelDays:15,packagingDays:10,approvalMin:60,approvalMax:90,packsPerDay:235,minMfgDays:20,qcDays:2,dispatchDays:5}, SET.timeline||{});
  const ups = (b.upd||[]), DAY=864e5, now=new Date(), idx=DBX.stageIndex(b.stage), I=k=>DBX.stageIndex(k);
  const at = k => { const u=ups.find(x=>x.stage===k); return u ? new Date(u.created_at) : null; };
  const add = (d,n) => new Date(d.getTime()+n*DAY);
  const start = at("confirmed") || new Date(b.updated_at||b.created_at);
  const held = (k,next) => { const a=at(k); if(!a) return 0; const z=at(next) || (b.stage===k?now:a); return Math.max(0,(z-a)/DAY); };
  const h40=held("awaiting_40","approval_packaging"), h50=held("awaiting_50","ready_dispatch");
  const md = Math.max(T.minMfgDays, Math.ceil(b.packs/T.packsPerDay));
  const lEnd=add(start,T.labelDays), pS=add(lEnd,h40), pE=add(pS,T.packagingDays), mE=add(pE,md), qE=add(mE,T.qcDays);
  const dS=add(new Date(Math.max(qE, add(pS,T.approvalMin))), h50), dE=add(dS,T.dispatchDays);
  const dLate=add(add(new Date(Math.max(qE, add(pS,T.approvalMax))), h50), T.dispatchDays);
  const rows=[
    {name:"Label design", ps:start, pe:lEnd, from:"label_design", done:"awaiting_40"},
    {name:`Packaging (govt approval ${T.approvalMin}–${T.approvalMax} days runs alongside)`, ps:pS, pe:pE, from:"approval_packaging", done:"manufacturing"},
    {name:`Manufacturing: ${num(b.packs)} packs, about ${md} days`, ps:pE, pe:mE, from:"manufacturing", done:"qc"},
    {name:"Quality check", ps:mE, pe:qE, from:"qc", done:"awaiting_50"},
    {name:"Dispatch", ps:dS, pe:dE, from:"ready_dispatch", done:"dispatched"}];
  let cur=null;
  rows.forEach(r=>{ r.as=at(r.from); r.isDone = b.stage!=="cancelled" && idx>=I(r.done); r.ae = r.isDone ? (at(r.done)||null) : null;
    if(!r.isDone && !cur) cur=r; });
  const late = cur && !HOLD.includes(b.stage) ? Math.floor((now-cur.pe)/DAY) : 0;
  let chip;
  if(["dispatched","delivered"].includes(b.stage)) chip=`<span class="pill ok">${esc(stage(b.stage))}${at("dispatched")?" "+fmtD(at("dispatched")):""}</span>`;
  else if(HOLD.includes(b.stage)) chip=`<span class="pill wait">On hold ${Math.round(b.stage==="awaiting_40"?h40:h50)} days</span>`;
  else if(late>0) chip=`<span class="pill due">${late} day${late===1?"":"s"} behind plan</span>`;
  else { const left=Math.ceil((cur.pe-now)/DAY); chip=`<span class="pill ok">On track${cur?`: ${esc(cur.name.split(":")[0].split(" (")[0])} due in ${Math.max(0,left)} d`:""}</span>`; }
  return {rows, cur, late, chip, dispatchBy:dE, dispatchLatest:dLate, hold:Math.round(h40+h50), start, at, next: cur?cur.pe.getTime():9e15};
}
function timelineHTML(b){ const p=plan(b), now=new Date();
  return `<p style="margin:0 0 10px"><b>Target dispatch ${fmtD(p.dispatchBy)}</b> <span class="muted small">(latest ${fmtD(p.dispatchLatest)} if govt approval takes the full time)</span><br>
    <span class="small muted">Plan starts ${fmtD(p.start)}, when the order was cleared.${p.hold?` Includes ${p.hold} day${p.hold===1?"":"s"} on hold waiting for clearance.`:""}</span></p>
  <ol class="tl">${p.rows.map(r=>{ const st = r.isDone ? "done" : r===p.cur ? (HOLD.includes(b.stage)?"hold":"cur") : "next";
    const lateBy = !r.isDone ? Math.floor((now-r.pe)/864e5) : 0, early = r.isDone && r.ae ? Math.round((r.pe-r.ae)/864e5) : null;
    return `<li class="${st}"><div class="tlh"><b>${esc(r.name)}</b>
      ${st==="done"?`<span class="pill ok">Done${early!==null?(early>=0?`, ${early} d early`:`, ${-early} d late`):""}</span>`:st==="hold"?`<span class="pill wait">On hold</span>`:st==="cur"?(lateBy>0?`<span class="pill due">${lateBy} d behind</span>`:r.as?`<span class="pill ok">In progress</span>`:`<span class="pill wait">Ready to start</span>`):`<span class="pill dim">Planned</span>`}</div>
      <span class="small muted">Plan ${fmtD(r.ps)} to ${fmtD(r.pe)}${r.as?`. Started ${fmtD(r.as)}`:""}${r.ae?`, finished ${fmtD(r.ae)}`:""}</span></li>`; }).join("")}</ol>`;
}

const ACT_KINDS = [["all","All"],["visitors","Visitors"],["accounts","Sign-ups & logins"],["engagement","Browsing & plans"],["bookings","Bookings"],["payments","Payments"],["team","Team"]];
const evKind = t => t==="visit"?"visitors" : (t==="signup"||t==="login")?"accounts" : t==="slot_booked"?"bookings" : t==="payment_submitted"?"payments" : "engagement";
function activityItems(){
  const sessUser={}; D.events.forEach(e=>{ if(e.user_id && e.session_id) sessUser[e.session_id]=e.user_id; });
  const ev = D.events.map(e=>{ const uid=e.user_id||sessUser[e.session_id]; return {t:e.created_at, kind:evKind(e.type), uid, sid:e.session_id, text:evText(e)}; });
  const tm = D.updates.filter(u=>STAFF.includes(u.by_role)).map(u=>{ const b=D.bookings.find(x=>x.id===u.booking_id);
    return {t:u.created_at, kind:"team", staff:`${u.by_name||"Staff"} (${u.by_role})`, bid:u.booking_id, text:`moved ${b?esc(b.code)+" "+esc(b.brand||""):"an order"} to ${esc(stage(u.stage))}${u.note?` — ${esc(u.note)}`:""}`}; });
  return ev.concat(tm).sort((a,b)=>String(b.t).localeCompare(String(a.t)));
}

}
function prodDrawer(b, nx){
  const fl=(b.flavours||[]);
  return `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Order ${esc(b.code)}">
    <div class="dh"><div><h2 style="margin:0">${esc(b.brand||b.name)}</h2><span class="muted small">${esc(b.code)}. Slot ${b.slot_no}, ${monthLabel(b.slot_month)}.</span></div><button class="xbtn" data-act="close" aria-label="Close">×</button></div>
    <p>${stagePill(b)} ${plan(b).chip}</p>
    ${b.stage==="qc" && can("admin","production")?`<p><button class="btn btn-leaf" data-qc="${b.id}">QC passed: upload report</button></p>`:b.stage==="ready_dispatch" && can("admin","production")?`<p><button class="btn btn-primary" data-dispatch="${b.id}">Dispatch now</button></p>`:nx && can("admin","production")?`<p><button class="btn btn-leaf" data-move="${b.id}" data-to="${nx}">${esc(MOVE_LABEL[nx]||("Move to "+stage(nx)))}</button></p>`:HOLD.includes(b.stage)?`<p class="small muted">Paused until Accounts clears the next step. You'll see it move here automatically.</p>`:""}
    <section class="card"><h3>Order details</h3><dl class="kv"><dt>Brand</dt><dd>${esc(b.brand||"–")}</dd><dt>Customer</dt><dd>${esc(b.name)}, ${esc(b.city||"")}</dd>
      <dt>Contact</dt><dd>${esc(b.phone)} <a href="tel:+91${esc(b.phone)}">Call</a> <a href="${wa(b.phone)}" target="_blank" rel="noopener">WhatsApp</a></dd>
      <dt>Batch</dt><dd><b>${num(b.packs)} packs</b> (${num(b.packs*10)} sticks), ${fl.length} flavours</dd></dl>
      <div class="tablewrap" style="margin-top:12px"><table style="min-width:340px"><thead><tr><th>Flavour</th><th class="num">Packs</th><th class="num">Print lots of 1,000</th></tr></thead>
      <tbody>${fl.map(f=>`<tr><td>${esc(f.name)}</td><td class="num">${num(f.packs)}</td><td class="num">${num(f.packs/1000)}</td></tr>`).join("")}</tbody></table></div></section>
    ${docsHTML(b)?`<section class="card"><h3>Documents</h3>${docsHTML(b)}${(b.dispatch||{}).invoice_no?`<p class="small muted" style="margin:8px 0 0">Print the invoice and e-way bill and hand them to the transporter with the consignment.</p>`:""}</section>`:""}
    <section class="card"><h3>Timeline to dispatch</h3>${timelineHTML(b)}</section>
    <section class="card"><h3>History</h3><ul class="feed">${(b.upd||[]).filter(u=>!["awaiting_payment","payment_review","cancelled"].includes(u.stage)).map(u=>Object.assign({},u,{note:["production","admin"].includes(u.by_role)?u.note:""})).slice().reverse().map(u=>`<li><span><b>${esc(stage(u.stage))}</b>${u.note?` — ${esc(u.note)}`:""}<span class="small muted" style="display:block">${esc(u.by_name||"")}${u.by_role&&u.by_role!=="system"?` (${esc(u.by_role)})`:""}</span></span><time>${fmtDT(u.created_at)}</time></li>`).join("")}</ul></section>
  </aside>`;
}
function wireDrawer(){ const d=document.querySelector(".drawer"); if(d && !d.contains(document.activeElement)) d.querySelector(".xbtn").focus({preventScroll:true}); }

/* ---------- stage move dialog ---------- */
function askNote(title, hint){ return new Promise(res=>{
  const dl=document.createElement("dialog");
  dl.innerHTML=`<form method="dialog"><h2>${esc(title)}</h2><div class="field"><label for="dn">Note for the customer (optional)</label><textarea id="dn" placeholder="${esc(hint||"")}"></textarea></div>
    <div class="actions"><button class="btn btn-leaf" value="ok">Confirm</button><button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button></div></form>`;
  document.body.appendChild(dl); dl.addEventListener("close",()=>{ const v=dl.returnValue==="ok"?dl.querySelector("textarea").value.trim():null; dl.remove(); res(v); }); dl.showModal(); }); }
const HINTS = { label_design:"Designer assigned, first draft in 7 days", awaiting_40:"Customer approved final label on…", manufacturing:"All packaging received, line booked from…", qc:"Batch complete, samples sent to QC", awaiting_50:"QC passed, batch packed", dispatched:"Transporter name and LR / tracking number", delivered:"Received by customer on…" };

/* ---------- events ---------- */
app.addEventListener("click", async e=>{
  const t=e.target, g=s=>t.closest(s);
  if(g("[data-tab]")){ TAB=g("[data-tab]").dataset.tab; DRAWER=null; render(); window.scrollTo(0,0); return; }
  if(g("[data-range]")){ Q.range=+g("[data-range]").dataset.range; render(); return; }
  if(g("[data-leadf]")){ Q.leadf=g("[data-leadf]").dataset.leadf; render(); return; }
  if(g("[data-bkf]")){ Q.bkf=g("[data-bkf]").dataset.bkf; render(); return; }
  if(g("[data-actf]")){ Q.actf=g("[data-actf]").dataset.actf; render(); return; }
  if(g("[data-payf]")){ Q.payf=g("[data-payf]").dataset.payf; render(); return; }
  if(g("[data-move]")){ e.stopPropagation(); const b=g("[data-move]"), to=b.dataset.to; const note=await askNote(MOVE_LABEL[to] ? MOVE_LABEL[to]+"?" : `Move to ${stage(to)}?`, HINTS[to]); if(note===null) return;
    try{ await DB.setStage(b.dataset.move, to, note); await loadAll(); toast(`Moved to ${esc(stage(to))}`, "The customer sees this now."); render(); }catch(ex){ toast(esc(ex.message)); } return; }
  if(g("[data-qc]")){ e.stopPropagation(); const b=boardOrders().find(x=>x.id===g("[data-qc]").dataset.qc); const r=await askQC(b); if(!r) return;
    try{ await DB.submitQC(b.id, r); await loadAll(); toast("QC submitted", "Report saved. The order waits for dispatch clearance."); render(); }catch(ex){ toast(esc(ex.message)); } return; }
  if(g("[data-dispatch]")){ e.stopPropagation(); const b=boardOrders().find(x=>x.id===g("[data-dispatch]").dataset.dispatch); const info=await askDispatch(b); if(!info) return;
    try{ await DB.markDispatched(b.id, info); await loadAll(); toast("Marked as dispatched", "The customer sees transporter and LR details now."); render(); }catch(ex){ toast(esc(ex.message)); } return; }
  if(g("[data-doc]")){ e.stopPropagation(); openDoc(g("[data-doc]").dataset.doc); return; }
  if(g("[data-ship]")){ const id=g("[data-ship]").dataset.ship, a=document.getElementById("sa-"+id), n=document.getElementById("sn-"+id);
    if(a.value===""){ toast("Enter the shipping charge (0 if none)."); a.focus(); return; }
    try{ await DB.setShipping(id, a.value, n.value.trim()); await loadAll(); toast(Number(a.value)>0?"Shipping charge sent to customer":"No shipping charge: moved to invoicing"); render(); }catch(ex){ toast(esc(ex.message)); } return; }
  if(g("[data-lead]")){ DRAWER={type:"lead", id:g("[data-lead]").dataset.lead}; render(); return; }
  if(g("[data-bk]")){ DRAWER={type:"bk", id:g("[data-bk]").dataset.bk}; render(); return; }
  if(g("[data-goto-pay]")){ const id=g("[data-goto-pay]").dataset.gotoPay, p=D.payments.find(x=>x.id===id); DRAWER=null; TAB=can("admin","accounts")?"payments":TAB; Q.payf=p?p.status:"all"; render();
    document.getElementById("sl-"+id)?.scrollIntoView({block:"center"}); if(!slipCache[id]) loadSlip(id); return; }
  if(g("[data-slip]")){ loadSlip(g("[data-slip]").dataset.slip); return; }
  if(g("[data-openslip]")){ const s=slipCache[g("[data-openslip]").dataset.openslip]; if(s) window.open(s.url,"_blank","noopener"); return; }
  if(g("[data-verify]")||g("[data-reject]")){ const ok=!!g("[data-verify]"), id=(g("[data-verify]")||g("[data-reject]")).dataset[ok?"verify":"reject"], note=(document.getElementById("pn-"+id)||{}).value||"";
    if(!ok && !note.trim()){ toast("Write the reason for rejection first.","The customer sees this note."); document.getElementById("pn-"+id)?.focus(); return; }
    if(ok && !confirm("Verify this payment? Confirm the UTR is in the bank statement.")) return;
    try{ await DB.reviewPayment(id, ok, note.trim()); await loadAll(); toast(ok?"Payment verified":"Payment rejected", "The customer's order status is updated."); render(); }catch(ex){ toast(esc(ex.message)); } return; }
  if(g("[data-setstage]")){ const id=g("[data-setstage]").dataset.setstage, st=document.getElementById("adst").value; const note=await askNote(`Set stage to ${stage(st)}?`, "Reason for the override"); if(note===null) return;
    try{ await DB.setStage(id, st, note); await loadAll(); toast("Stage updated"); render(); }catch(ex){ toast(esc(ex.message)); } return; }
  if(g("[data-delt]")){ SET.testimonials = readTestimonials(); SET.testimonials.splice(+g("[data-delt]").dataset.delt,1); document.getElementById("tlist").innerHTML=SET.testimonials.map(titem).join(""); return; }
  const a=g("[data-act]"); if(!a) return;
  const act=a.dataset.act;
  if(act==="close"){ DRAWER=null; render(); }
  if(act==="refresh"){ try{ await loadAll(); render(); toast("Data refreshed"); }catch(ex){ toast(esc(ex.message)); } }
  if(act==="signout"){ document.querySelector(".toastbox")?.remove(); await DB.signOut(); }
  if(act==="csv") csv();
  if(act==="addt"){ SET.testimonials = readTestimonials(); SET.testimonials.push({brand:"", color:"#2E7D32", tag_en:"Client brand"}); document.getElementById("tlist").innerHTML=SET.testimonials.map(titem).join(""); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && DRAWER && !document.querySelector("dialog[open]")){ DRAWER=null; render(); } });

/* ---------- boot ---------- */
/* guard.js checks the Netlify login and the role, then calls startPortal(profile).
   The panel never shows its own sign-in. Staff reach it only through home.html. */
window.startPortal = async function(profile){
  ME = { id: profile.id, name: profile.name || profile.email || "Staff", phone: profile.phone || "", email: profile.email || "", role: profile.role, loginId: profile.loginId || "" };
  window.EXB_PROFILE = ME;
  try{ await DB.init(); }catch(e){ loadErr = e.message; }
  await enter();
};

</script>
<script type="module" src="js/dist/guard.js"></script>
